<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Ashfall: Last Bastion — build, recruit, and survive the zombie apocalypse.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Ashfall: Last Bastion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="baseCanvas" class="view"></canvas>
  <canvas id="worldCanvas" class="view hidden"></canvas>
  <div id="hud"></div>
  <div id="sideL"></div>
  <div id="side"></div>
  <div id="worldui" class="hidden"></div>
  <div id="tileinfo" class="hidden"></div>
  <div id="quest" class="hidden"></div>
  <div id="nav"></div>
  <div id="modals"></div>
  <div id="battle" class="hidden"></div>
  <div id="toasts"></div>
  <div id="splash">
    <div class="embers" id="embers"></div>
    <h2>THE LAST</h2>
    <h1>ASHFALL</h1>
    <h2>BASTION</h2>
    <p>The dead walk. The cities burn. Build your bastion, rally survivors, and take back the wasteland.</p>
    <div id="splashForm"></div>
  </div>
</div>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
