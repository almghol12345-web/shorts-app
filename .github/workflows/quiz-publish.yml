name: Quiz Publish

# The eye-challenge Shorts take turns with the explainers (see shorts/rotation.py):
# explainer, quiz, explainer, quiz. Scheduled runs follow the same daily plan as Daily Shorts.
on:
  schedule:
    - cron: "41 9-22 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true
      kind:
        description: "letters / numbers / colors (empty = next in turn)"
        default: ""
      seed:
        description: "Seed (empty = next unused)"
        default: ""
      privacy:
        description: "public / unlisted / private"
        default: "public"

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/quiz_slot.py | tee -a "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 6
        run: |
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Make and publish
        if: steps.gate.outputs.run == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORTS_PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          args=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ] && args="$args --no-upload"
          [ -n "${{ inputs.kind }}" ] && args="$args --kind ${{ inputs.kind }} --seed ${{ inputs.seed || 3 }}"
          python scripts/quiz_publish.py $args
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: quiz-${{ github.run_number }}
          path: output/quiz.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Save published-topics history
        if: steps.gate.outputs.run == 'true'
        run: |
          [ -f output/published.jsonl ] || exit 0
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git checkout -q -f -B history-update "origin/${GITHUB_REF_NAME}"
            python scripts/merge_history.py output/published.jsonl data/history.json
            git add data/history.json
            git commit -qm "chore: record published Shorts" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
