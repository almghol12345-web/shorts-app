name: Long Video

on:
  schedule:
    # Tuesdays and Fridays, ~8:40pm Riyadh (UTC+3): a long compilation for watch hours
    - cron: "41 17 * * 2,5"
  workflow_dispatch:
    inputs:
      kind:
        description: "mystery (stories) / news (amazing facts)"
        default: "mystery"
      stories:
        description: "How many stories"
        default: "7"
      privacy:
        description: "public / unlisted / private"
        default: "public"

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: |
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Make the long video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DARIJAT_API_KEY: ${{ secrets.DARIJAT_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          DARIJAT_VOICE: ${{ vars.DARIJAT_VOICE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORTS_PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          # alternate: stories on Tuesdays, amazing facts on Fridays
          KIND="${{ inputs.kind }}"
          if [ -z "$KIND" ]; then KIND=$([ "$(date -u +%u)" = "5" ] && echo news || echo mystery); fi
          python -m shorts --long "$KIND" --stories "${{ inputs.stories || '7' }}" --upload
      - name: Keep the video (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-${{ github.run_number }}
          path: |
            output/long-*.mp4
            output/long_thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore
      - name: Save long-video history
        run: |
          [ -n "$(git status --porcelain data/long_history.json)" ] || exit 0
          cp data/long_history.json /tmp/long_history.json
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git checkout -q -f -B long-update "origin/${GITHUB_REF_NAME}"
            cp /tmp/long_history.json data/long_history.json
            git add data/long_history.json
            git commit -qm "chore: record long video" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
