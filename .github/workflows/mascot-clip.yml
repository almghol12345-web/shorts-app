name: Mascot Test Clip

on:
  workflow_dispatch:
    inputs:
      moves:
        description: "Moves to make (space separated), empty = all"
        default: ""

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -r requirements.txt
      - name: Make the character clips
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          ART_PROVIDER: ${{ vars.ART_PROVIDER }}
        run: python scripts/mascot_clip.py ${{ inputs.moves }}
      - name: Publish on the 'mascot' branch
        if: always()
        run: |
          mkdir -p /tmp/m && cp output/mascot/* /tmp/m/ 2>/dev/null; cd /tmp/m
          git init -q && git checkout -q -b mascot
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -qm "mascot test clip"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mascot
