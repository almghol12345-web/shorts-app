name: Daily Shorts

on:
  schedule:
    # Twice a day, timed for Gulf evening viewers (UTC): ~5pm and ~9pm Riyadh.
    - cron: "13 14 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make"
        default: "1"
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true
      voice:
        description: "Try a specific ElevenLabs voice by name (empty = channel voice)"
        default: ""
      privacy:
        description: "public / unlisted / private"
        default: "public"

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          # Static build (has libass for Arabic captions); apt is the fallback.
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/ffmpeg.tar.xz; then
            mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
            /tmp/ffmpeg/bin/ffmpeg -hide_banner -version | head -1
          else
            for i in 1 2 3; do
              sudo timeout 150 apt-get install -y -qq --no-install-recommends ffmpeg && break
              sudo timeout 150 apt-get update -qq || true
            done
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Make Shorts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_PICK: ${{ inputs.voice }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORTS_NICHE: ${{ vars.SHORTS_NICHE }}
          SHORTS_VOICE: ${{ vars.SHORTS_VOICE }}
          SHORTS_PRIVACY: ${{ inputs.privacy || vars.SHORTS_PRIVACY }}
          SHORTS_NARRATOR: ${{ vars.SHORTS_NARRATOR }}
        run: |
          UPLOAD_FLAG="--upload"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" != "true" ]; then UPLOAD_FLAG=""; fi
          python -m shorts --count "${{ inputs.count || '1' }}" $UPLOAD_FLAG

      - name: Keep the videos (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish preview frames (branch "previews")
        if: always()
        run: |
          [ -f output/preview.jpg ] || exit 0
          mkdir -p /tmp/prev && cp output/preview.jpg /tmp/prev/latest.jpg
          cd /tmp/prev
          git init -q && git checkout -q -b previews
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add latest.jpg && git commit -qm "preview ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews

      - name: Save published-topics history
        if: always()
        run: |
          [ -f output/published.jsonl ] || exit 0
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          # merge onto the latest branch tip (no rebase conflicts with other edits)
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git checkout -q -f -B history-update "origin/${GITHUB_REF_NAME}"
            python scripts/merge_history.py output/published.jsonl data/history.json
            git add data/history.json
            git commit -qm "chore: record published Shorts" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
