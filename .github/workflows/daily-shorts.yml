name: Daily Shorts

on:
  schedule:
    # GitHub sometimes delays or drops scheduled runs, so the job wakes every hour from
    # noon to 1am Riyadh (UTC+3) and scripts/slot.py keeps the plan: 4 Shorts a day,
    # 3+ hours apart, the late-night one a mystery story.
    - cron: "11 9-22 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make"
        default: "1"
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true
      voice:
        description: "Try a specific ElevenLabs voice by name (empty = channel voice)"
        default: ""
      darijat_voice:
        description: "Darijat voice name to try (empty = channel voice)"
        default: ""
      privacy:
        description: "public / unlisted / private"
        default: "public"
      kind:
        description: "faith (Quran / Companions story) / news (amazing facts) / mystery (story)"
        default: "news"
      topic:
        description: "Make this exact script (topic id), empty = automatic choice"
        default: ""
      narrator:
        description: "mascot = show the channel character (test before approval)"
        default: ""
      quality:
        description: "video = motion on every shot; best = also sharper images (costs more)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Decide (scheduled runs follow the daily plan)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/slot.py | tee -a "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 8
        run: |
          # Static build (has libass for Arabic captions); apt is the fallback.
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/ffmpeg.tar.xz; then
            mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
            /tmp/ffmpeg/bin/ffmpeg -hide_banner -version | head -1
          else
            for i in 1 2 3; do
              sudo timeout 150 apt-get install -y -qq --no-install-recommends ffmpeg && break
              sudo timeout 150 apt-get update -qq || true
            done
          fi

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q

      - name: Paid scene clips from earlier runs
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: scene_cache
          key: scenes-${{ github.run_id }}
          restore-keys: scenes-

      - name: Make Shorts
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DARIJAT_API_KEY: ${{ secrets.DARIJAT_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          ART_PROVIDER: ${{ vars.ART_PROVIDER }}
          SHORTS_KIND: ${{ steps.gate.outputs.kind }}
          SHORTS_TOPIC: ${{ inputs.topic }}
          REPLICATE_VIDEO_SHOTS: ${{ vars.REPLICATE_VIDEO_SHOTS }}
          DARIJAT_VOICE: ${{ inputs.darijat_voice || (steps.gate.outputs.kind == 'faith' && 'فيصل' || 'جسار') }}
          DARIJAT_API_URL: ${{ vars.DARIJAT_API_URL }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_PICK: ${{ inputs.voice }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORTS_NICHE: ${{ vars.SHORTS_NICHE }}
          SHORTS_VOICE: ${{ vars.SHORTS_VOICE }}
          SHORTS_PRIVACY: ${{ inputs.privacy || vars.SHORTS_PRIVACY }}
          SHORTS_NARRATOR: ${{ inputs.narrator || vars.SHORTS_NARRATOR }}
        run: |
          if [ "${{ inputs.quality }}" = "best" ]; then
            export REPLICATE_VIDEO_SHOTS=all REPLICATE_IMAGE_MODEL=black-forest-labs/flux-1.1-pro
          elif [ "${{ inputs.quality }}" = "video" ]; then
            export REPLICATE_VIDEO_SHOTS=all          # every shot moves, cheap images
          elif [ "${{ inputs.quality }}" = "still" ]; then
            export REPLICATE_VIDEO_SHOTS=none         # drawings only (doodle explainers)
          fi
          UPLOAD_FLAG="--upload"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" != "true" ]; then UPLOAD_FLAG=""; fi
          python -m shorts --count "${{ inputs.count || '1' }}" $UPLOAD_FLAG

      - name: Keep the videos (7 days)
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/qa.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep a copy for TikTok (branch "tiktok", latest 6)
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          [ -f output/published.jsonl ] || exit 0
          f=$(ls output/*.mp4 2>/dev/null | head -1); [ -n "$f" ] || exit 0
          mkdir -p /tmp/tk && cd /tmp/tk
          git init -q && git checkout -q -b tiktok
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 "$remote" tiktok 2>/dev/null; then git checkout -q FETCH_HEAD -- . 2>/dev/null || true; fi
          n=$(printf "%05d" ${{ github.run_number }})
          cp "$GITHUB_WORKSPACE/$f" "$n.mp4"
          python3 -c "import json,sys; r=[json.loads(l) for l in open(sys.argv[1]) if l.strip()][-1]; print(r.get('title','').replace('#shorts','').strip())" "$GITHUB_WORKSPACE/output/published.jsonl" > "$n.txt"
          ls *.mp4 | sort | head -n -6 | while read old; do rm -f "$old" "${old%.mp4}.txt"; done
          git add -A && git commit -qm "tiktok copies" && git push -qf "$remote" HEAD:tiktok

      - name: Publish preview frames (branch "previews")
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          [ -f output/preview.jpg ] || exit 0
          mkdir -p /tmp/prev && cp output/preview.jpg /tmp/prev/latest.jpg
          cd /tmp/prev
          git init -q && git checkout -q -b previews
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add latest.jpg && git commit -qm "preview ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews

      - name: Save published-topics history
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          [ -f output/published.jsonl ] || exit 0
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          # merge onto the latest branch tip (no rebase conflicts with other edits)
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git checkout -q -f -B history-update "origin/${GITHUB_REF_NAME}"
            python scripts/merge_history.py output/published.jsonl data/history.json
            git add data/history.json
            git commit -qm "chore: record published Shorts" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
