name: Daily Shorts

on:
  schedule:
    # Twice a day, timed for Gulf evening viewers (UTC): ~5pm and ~9pm Riyadh.
    - cron: "13 14 * * *"
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make"
        default: "1"
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Make Shorts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORTS_NICHE: ${{ vars.SHORTS_NICHE }}
          SHORTS_VOICE: ${{ vars.SHORTS_VOICE }}
          SHORTS_PRIVACY: ${{ vars.SHORTS_PRIVACY }}
        run: |
          UPLOAD_FLAG="--upload"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" != "true" ]; then UPLOAD_FLAG=""; fi
          python -m shorts --count "${{ inputs.count || '1' }}" $UPLOAD_FLAG

      - name: Keep the videos (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save published-topics history
        run: |
          if [ -n "$(git status --porcelain data/history.json)" ]; then
            git config user.name "shorts-bot"
            git config user.email "shorts-bot@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: record published Shorts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
