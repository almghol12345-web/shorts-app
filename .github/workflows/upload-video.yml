name: Upload Approved Video

# Publishes a video an earlier Daily Shorts run already made (and the owner approved),
# without making it again.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Daily Shorts run that made the video"
        required: true
      topic:
        description: "Script topic (for title, description and hashtags)"
        required: true
      privacy:
        description: "public / unlisted / private"
        default: "public"

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: video
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/f.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/f.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORTS_PRIVACY: ${{ inputs.privacy }}
        run: |
          f=$(find video -name '*.mp4' | head -1)
          python scripts/upload_existing.py "$f" "${{ inputs.topic }}"
      - name: Save published-topics history
        run: |
          [ -f output/published.jsonl ] || exit 0
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git checkout -q -f -B history-update "origin/${GITHUB_REF_NAME}"
            python scripts/merge_history.py output/published.jsonl data/history.json
            git add data/history.json
            git commit -qm "chore: record published Shorts" || exit 0
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
