name: Check Speech

# Listens to a finished video (speech recognition) and prints what the voice actually said,
# line by line with times, to compare against the script and catch mispronounced words.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Daily Shorts run that made the video (or 'voice' for the voice samples)"
        required: true
      model:
        description: "Recognition model size (small / medium / large-v3)"
        default: "medium"

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Voice samples
        if: inputs.run_id == 'voice'
        run: |
          git clone -q --depth 1 -b voice "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video
      - uses: actions/download-artifact@v4
        if: inputs.run_id != 'voice'
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: video
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper numpy
      - name: Install ffmpeg
        run: |
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/f.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/f.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Transcribe
        run: |
          python - "${{ inputs.model }}" <<'PY'
          import glob, subprocess, sys
          import numpy as np
          from faster_whisper import WhisperModel
          # decode with ffmpeg (the bundled decoder breaks on some library versions)
          model = WhisperModel(sys.argv[1], device="cpu", compute_type="int8")
          files = sorted(glob.glob("video/**/*.mp4", recursive=True) + glob.glob("video/*.mp3"))
          for f in [x for x in files if "beep" not in x and "compare" not in x]:
              print(f"===== {f}")
              raw = subprocess.run(["ffmpeg", "-v", "error", "-i", f, "-ac", "1", "-ar", "16000",
                                    "-f", "f32le", "-"], capture_output=True, check=True).stdout
              audio = np.frombuffer(raw, dtype=np.float32)
              segments, _ = model.transcribe(audio, language="ar", word_timestamps=True, beam_size=5)
              for s in segments:
                  words = " ".join(f"{w.word.strip()}({w.probability:.2f})" for w in s.words)
                  print(f"[{s.start:6.2f}-{s.end:6.2f}] {s.text.strip()}")
                  print(f"      {words}")
          PY
