name: Voice Sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        timeout-minutes: 6
        run: |
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Make the samples
        env:
          DARIJAT_API_KEY: ${{ secrets.DARIJAT_API_KEY }}
          DARIJAT_VOICE: ${{ vars.DARIJAT_VOICE }}
        run: python scripts/voice_sample.py
      - name: Publish on the 'voice' branch
        run: |
          mkdir -p /tmp/v && cp output/voice/*.mp3 /tmp/v/ && cd /tmp/v
          git init -q && git checkout -q -b voice
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -qm "voice samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice
