name: Voice Sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -r requirements.txt
      - name: Make the samples
        env:
          DARIJAT_API_KEY: ${{ secrets.DARIJAT_API_KEY }}
          DARIJAT_VOICE: ${{ vars.DARIJAT_VOICE }}
        run: python scripts/voice_sample.py
      - name: Publish on the 'voice' branch
        run: |
          mkdir -p /tmp/v && cp output/voice/*.mp3 /tmp/v/ && cd /tmp/v
          git init -q && git checkout -q -b voice
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -qm "voice samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice
