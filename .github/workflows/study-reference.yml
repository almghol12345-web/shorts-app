name: Study Reference Video

# Looks at a Short the owner likes: its public stats, frames every 2 seconds and what is said,
# and puts the results on the "reference" branch so we can copy what makes it work.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id"
        required: true

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth faster-whisper numpy yt-dlp
      - name: Install ffmpeg
        run: |
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/f.tar.xz
          mkdir -p /tmp/ffmpeg && tar -xf /tmp/f.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Public details
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: mkdir -p out && python scripts/reference_info.py "${{ inputs.video_id }}" | tee out/info.txt
      - name: Download the video
        continue-on-error: true
        run: |
          yt-dlp -q -f "b[ext=mp4]/b" -o out/ref.mp4 "https://www.youtube.com/shorts/${{ inputs.video_id }}" \
            || yt-dlp -q --extractor-args "youtube:player_client=tv,ios" -o out/ref.mp4 "https://www.youtube.com/shorts/${{ inputs.video_id }}"
      - name: Frames and speech
        if: hashFiles('out/ref.mp4') != ''
        run: |
          ffmpeg -v error -i out/ref.mp4 -vf "fps=1/2,scale=270:-1,tile=6x4" -frames:v 1 out/frames.jpg
          ffmpeg -v error -i out/ref.mp4 -vf "fps=1/2,scale=540:-1" out/f_%02d.jpg
          python - <<'PY' | tee out/speech.txt
          import subprocess
          import numpy as np
          from faster_whisper import WhisperModel
          raw = subprocess.run(["ffmpeg", "-v", "error", "-i", "out/ref.mp4", "-ac", "1", "-ar", "16000",
                                "-f", "f32le", "-"], capture_output=True, check=True).stdout
          m = WhisperModel("medium", device="cpu", compute_type="int8")
          segs, info = m.transcribe(np.frombuffer(raw, dtype=np.float32), beam_size=5)
          print("language", info.language)
          for s in segs:
              print(f"[{s.start:6.2f}-{s.end:6.2f}] {s.text.strip()}")
          PY
      - name: Push to the reference branch
        run: |
          cd out
          git init -q && git checkout -q -b reference
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add -A && git commit -qm "reference ${{ inputs.video_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" reference
