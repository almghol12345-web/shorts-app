name: Share Video Sample

# Copies a finished video from an earlier run onto the "samples" branch so it can be
# sent to the owner for review (artifacts need a GitHub login to open).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of the Daily Shorts run that made the video"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: video
      - name: Push to the samples branch
        run: |
          f=$(find video -name '*.mp4' | head -1)
          mkdir out && cp "$f" out/sample.mp4
          cd out
          git init -q && git checkout -q -b samples
          git config user.name "shorts-bot" && git config user.email "shorts-bot@users.noreply.github.com"
          git add sample.mp4 && git commit -qm "sample from run ${{ inputs.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" samples
