<title>فجر الناجين</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen phone game. Resource bar on top, one swappable view, tab bar at the bottom. Battles open as a full-screen canvas. Single dark look by design: asphalt, rust and sodium-lamp amber. */
:root{
  --bg:#0e1215; --ground:#151b1f; --panel:#1a2127; --panel2:#232c34; --line:#33404a;
  --fg:#ece5d7; --muted:#8e99a2; --rust:#cf6a2c; --rust2:#a9521f; --amber:#f1b23c;
  --good:#64b66e; --bad:#e2513f; --sky:#5aa6d6;
  --r1:#4f8fd6; --r2:#a66be0; --r3:#e8a62d;
  --tank:#3f6f96; --atk:#9c3f2f; --sup:#3f8a5c;
  --fd:'Changa',system-ui,sans-serif; --fb:'Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input{font:inherit}
#app{height:100%;display:flex;flex-direction:column;direction:rtl;max-width:620px;margin:0 auto;position:relative;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{background:linear-gradient(180deg,#1c252b,#141a1e);border-bottom:1px solid var(--line);padding-block:8px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.top-r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.me .av{width:38px;height:38px;font-size:18px}
.me-t{display:grid;text-align:right;min-width:0}
.me-t b{font-family:var(--fd);font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-t small{color:var(--amber);font-size:12px;font-family:var(--fd)}
.gem{display:flex;align-items:center;gap:6px;background:#10161a;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;font-family:var(--fd);font-weight:700}
.gem i{font-style:normal;background:var(--rust);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;line-height:1}
.resrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rc{display:flex;align-items:center;gap:4px;background:#0f1518;border:1px solid #27323b;border-radius:8px;padding:3px 6px;font-family:var(--fd);font-size:13px;font-weight:600;min-width:0}
.rc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* view & tabs */
#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
#view.fixed{overflow:hidden}
.pad{padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#12181c;border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:grid;justify-items:center;gap:1px;padding:7px 2px 6px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.tab .ti{font-size:21px;line-height:1.1;filter:grayscale(.7);opacity:.75}
.tab.on{color:var(--amber)}
.tab.on .ti{filter:none;opacity:1}
.tab.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--rust);border-radius:0 0 3px 3px}
.dot{position:absolute;top:5px;left:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #12181c}

/* generic */
h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700;color:var(--muted);letter-spacing:.02em}
p{margin:0;line-height:1.6}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:800;font-family:var(--fd);font-size:15px;min-height:44px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#dc7533,#b2561f);border-color:#e58a4a;color:#fff;text-shadow:0 1px 0 #0005}
.btn.gold{background:linear-gradient(180deg,#f3c255,#cf9324);border-color:#f7d27a;color:#2a1a04}
.btn.ok{background:linear-gradient(180deg,#6cbf74,#3f8d4a);border-color:#86d18d;color:#08200c}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.cc{display:inline-flex;align-items:center;gap:3px;background:#0f1518;border:1px solid #2a353e;border-radius:7px;padding:2px 7px;font-family:var(--fd);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cc.lack{color:var(--bad);border-color:#5a2a24}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:#0f1518;border:1px solid var(--line);font-family:var(--fd);letter-spacing:.02em}
.prog{height:8px;background:#0b0f12;border-radius:5px;overflow:hidden;border:1px solid #27323b}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--rust));border-radius:5px}
.req{display:flex;gap:6px;align-items:center;font-size:14px}
.req.no{color:var(--bad)}
.req.yes{color:var(--good)}

/* base */
.base-wrap{display:grid;gap:12px;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.quest{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#2a2014,#1b2228);border:1px solid #5b4524;border-radius:12px;padding:8px 10px}
.quest .qk{font-family:var(--fd);font-size:11px;font-weight:800;color:#2a1a04;background:var(--amber);border-radius:6px;padding:2px 7px;flex:none}
.quest .qt{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.siege{display:flex;align-items:center;gap:8px;background:#3a1512;border:1px solid #7c2a22;color:#ffd2c8;border-radius:12px;padding:8px 12px;font-weight:800;animation:pulse 1.2s infinite}
@keyframes pulse{50%{background:#521c17}}
.shortcuts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.sc .si{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--panel2);border:1px solid var(--line)}
.sc .dot{top:-2px;left:calc(50% + 12px)}
.compound{position:relative;border-radius:18px;padding:12px;background:
  radial-gradient(ellipse at 50% 0%,#2a2a22 0,transparent 60%),
  repeating-linear-gradient(115deg,transparent 0 38px,#ffffff05 38px 40px),
  repeating-linear-gradient(25deg,transparent 0 61px,#00000030 61px 63px),
  #1a1f21;border:3px solid #3b3a33;box-shadow:inset 0 0 0 3px #232320,inset 0 0 40px #000a;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:hidden}
.compound::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0000 60%,#0e121588);}
.tile{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;aspect-ratio:1/1;max-width:100%;background:radial-gradient(circle at 50% 40%,#2d3438 0,#20262a 70%);border:1px solid #3a444b;border-radius:14px;padding:6px 4px;text-align:center;cursor:pointer;z-index:1}
.tile:active{transform:scale(.97)}
.tile.hq{grid-column:1/-1;aspect-ratio:auto;min-height:118px;background:radial-gradient(circle at 50% 35%,#3b3424 0,#22262a 70%);border-color:#6a5530}
.tile.hq .ti{font-size:52px}
.tile .ti{font-size:34px;line-height:1.1;filter:drop-shadow(0 4px 3px #000a)}
.tile .ti.dim{filter:grayscale(1) brightness(.6);opacity:.6}
.tile .tn{font-size:12px;font-weight:800;line-height:1.2;font-family:var(--fd)}
.tile .ts{font-size:11px;color:var(--muted);font-weight:700}
.tile .lv{position:absolute;top:5px;right:6px;background:#0d1114;border:1px solid #45525c;color:var(--amber);font-family:var(--fd);font-size:11px;font-weight:800;border-radius:6px;padding:0 5px;line-height:17px}
.tile.empty{background:transparent;border:2px dashed #3d4950}
.tile.locked{background:#14181b;border-color:#242b30;opacity:.7}
.tile .tbar{position:absolute;bottom:6px;left:8px;right:8px;height:6px}
.tile .tt{position:absolute;bottom:13px;left:0;right:0;font-size:11px;font-weight:800;color:var(--amber);font-family:var(--fd)}
.tile.busy .ti{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bub{position:absolute;top:-6px;left:-4px;display:flex;align-items:center;gap:2px;background:#f4ecd8;color:#20170c;border-radius:14px 14px 14px 3px;padding:2px 7px 2px 6px;font-family:var(--fd);font-weight:800;font-size:12px;box-shadow:0 3px 8px #000a;z-index:2;animation:bubin .3s}
@keyframes bubin{from{transform:scale(.4)}}
.builders{display:grid;gap:6px}
.bq{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700}
.bq .prog{flex:1}
.float{position:fixed;z-index:60;pointer-events:none;font-family:var(--fd);font-weight:800;color:var(--amber);text-shadow:0 2px 3px #000;animation:floatup 1s ease-out forwards}
@keyframes floatup{to{transform:translateY(-50px);opacity:0}}

/* heroes */
.av{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--fd);font-weight:800;color:#fff;flex:none;width:44px;height:44px;font-size:20px;border:3px solid var(--r1);text-shadow:0 1px 2px #0008}
.av.r2{border-color:var(--r2)} .av.r3{border-color:var(--r3);box-shadow:0 0 10px #e8a62d66}
.av.c-tank{background:radial-gradient(circle at 35% 30%,#6c9cc4,var(--tank))}
.av.c-atk{background:radial-gradient(circle at 35% 30%,#d06a52,var(--atk))}
.av.c-sup{background:radial-gradient(circle at 35% 30%,#73c08f,var(--sup))}
.av.c-me{background:radial-gradient(circle at 35% 30%,#e4884a,var(--rust2));border-color:var(--amber)}
.formation{background:linear-gradient(180deg,#1b2228,#151b1f);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.frow{display:flex;justify-content:center;gap:12px}
.slot{width:70px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700}
.slot .av{width:58px;height:58px;font-size:24px}
.slot .empty{width:58px;height:58px;border-radius:50%;border:2px dashed #4a5660;display:grid;place-items:center;color:var(--muted);font-size:24px}
.flabel{font-size:11px;color:var(--muted);text-align:center;font-weight:700;letter-spacing:.04em}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hc{position:relative;display:grid;justify-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;text-align:center}
.hc.r3{background:linear-gradient(180deg,#2c2416,var(--panel))}
.hc.r2{background:linear-gradient(180deg,#261d30,var(--panel))}
.hc .av{width:52px;height:52px;font-size:22px}
.hc b{font-family:var(--fd);font-size:14px}
.hc small{font-size:11px;color:var(--muted);font-weight:700}
.hc .in{position:absolute;top:6px;left:6px;font-size:10px;background:var(--rust);color:#fff;border-radius:5px;padding:0 5px;font-weight:800}
.hc .dot{top:6px;right:6px;left:auto}
.hc.lockd{opacity:.45}
.hc.lockd .av{background:#20272c;color:#56626b}
.stars{color:var(--amber);font-size:12px;letter-spacing:-1px;line-height:1}
.stars .off{color:#3b464e}
.stat{background:#10161a;border:1px solid #27323b;border-radius:10px;padding:8px;display:grid;gap:2px;text-align:center}
.stat small{color:var(--muted);font-size:11px;font-weight:700}
.stat b{font-family:var(--fd);font-size:17px}
.pull{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pull .hc{padding:6px 2px}
.pull .hc .av{width:40px;height:40px;font-size:17px}
.pull .new{position:absolute;top:2px;left:2px;font-size:9px;background:var(--good);color:#04200a;border-radius:4px;padding:0 4px;font-weight:800}

/* campaign */
.stagecard{background:
  linear-gradient(180deg,#0000,#0e1215 85%),
  repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 46px),
  radial-gradient(ellipse at 50% 0%,#5a2a1a 0,#1a1f22 70%);
  border:1px solid #5b3322;border-radius:16px;padding:16px;display:grid;gap:12px;text-align:center}
.stagecard .big{font-family:var(--fd);font-size:44px;font-weight:800;line-height:1;color:var(--amber);text-shadow:0 3px 0 #0008}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs .stat b.bad{color:var(--bad)} .vs .stat b.good{color:var(--good)}
.zrow{display:flex;justify-content:center;gap:6px;font-size:26px}
.path{display:grid;gap:8px}
.pn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}
.pn .pi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#10161a;border:2px solid var(--line);font-family:var(--fd);font-size:13px}
.pn.done{opacity:.55}
.pn.done .pi{border-color:var(--good);color:var(--good)}
.pn.cur{border-color:var(--rust);background:#2a1d16}
.pn.cur .pi{border-color:var(--amber);color:var(--amber)}
.pn.boss .pi{border-color:var(--bad)}

/* world */
.world{position:absolute;inset:0}
.world canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.whud{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.whud>*{pointer-events:auto}
.chip{background:#0e1215e6;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--fd);font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center}
.wmarch{position:absolute;bottom:10px;right:max(12px,env(safe-area-inset-right,0px));left:max(12px,env(safe-area-inset-left,0px));display:grid;gap:6px;pointer-events:none}
.wmarch .bq{background:#0e1215e6;pointer-events:auto}

/* alliance */
.msg{display:grid;gap:2px;background:var(--panel2);border-radius:12px 12px 12px 4px;padding:7px 10px;max-width:85%;justify-self:start}
.msg.mine{justify-self:end;background:#3a2418;border-radius:12px 12px 4px 12px}
.msg b{font-size:12px;color:var(--amber);font-family:var(--fd)}
.msg span{font-size:14px;line-height:1.45;word-break:break-word;user-select:text;-webkit-user-select:text}
.chat{display:grid;gap:6px;max-height:300px;overflow-y:auto;padding:4px}
.field{flex:1;min-width:0;background:#0f1518;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);direction:rtl;user-select:text;-webkit-user-select:text}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #26313a;font-weight:700;font-size:14px}
.mem:last-child{border:0}
.mem .av{width:34px;height:34px;font-size:15px}
.mem .p{margin-right:auto;color:var(--amber);font-family:var(--fd);font-size:13px}
.ally{display:flex;align-items:center;gap:12px}
.flag{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:15px;color:#fff;flex:none;border:2px solid #fff3}

/* modal */
#modal{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center;direction:rtl;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:620px;max-height:88%;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--rust);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #000;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px)}}
.sh-h{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-h .hi{font-size:34px;line-height:1}
.sh-h .htx{flex:1;min-width:0}
.sh-h .x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:18px;display:grid;place-items:center;flex:none}
.sh-b{overflow-y:auto;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.eff{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:#10161a;border:1px solid #27323b;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.eff .arr{color:var(--rust)}
.eff .nx{color:var(--good)}
.li{display:flex;align-items:center;gap:10px;background:#10161a;border:1px solid #27323b;border-radius:12px;padding:10px}
.li .lic{font-size:26px;width:40px;text-align:center;flex:none}
.li .lit{flex:1;min-width:0;display:grid;gap:3px}
.li .lit b{font-family:var(--fd);font-size:14px}
.li .lit small{color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--rust)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:grid;justify-items:center;gap:2px;background:#10161a;border:1px solid #27323b;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:700}
.day .d1{font-size:20px}
.day.got{opacity:.4}
.day.now{border-color:var(--amber);background:#2d2414}
.result{position:absolute;inset:0;display:grid;place-items:center;background:#000b;z-index:5;padding:20px}
.result .panel{width:min(360px,100%);text-align:center;justify-items:center}
.result h2{font-size:34px}
.win h2{color:var(--amber)} .lose h2{color:var(--bad)}

/* toast */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;z-index:80;display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:#0e1215f2;border:1px solid var(--line);border-right:3px solid var(--amber);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 20px #000a;animation:tin .25s;direction:rtl;max-width:100%}
.toast.bad{border-right-color:var(--bad)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* battle */
#battle{position:fixed;inset:0;z-index:50;background:#0b0e10;display:flex;flex-direction:column;direction:rtl;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.b-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:#12171a;border-bottom:1px solid var(--line)}
.b-top b{font-family:var(--fd);font-size:15px;display:block}
.b-top small{color:var(--amber);font-family:var(--fd);font-weight:700}
.b-ctl{display:flex;gap:6px}
.b-ctl button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px;font-family:var(--fd);min-height:36px}
.b-ctl button.on{background:var(--rust);border-color:#e58a4a;color:#fff}
.b-stage{flex:1;position:relative;overflow:hidden}
.b-stage canvas{position:absolute;inset:0;width:100%;height:100%}

const wallDef=wl=>wl?Math.round(300*wl*Math.pow(1.3,wl)*(1+.04*S.tech.def)):0;
const heroCap=tl=>5+5*tl;
const troopCap=bl=>300+bl*200;
const batchMax=bl=>20+bl*15;
const hospCap=hl=>hl*150;

const maxBuilders=()=>2;
function bCost(t,lv){const m=Math.pow(1.6,lv-1),c={};for(const k in BT[t].base)c[k]=Math.round(BT[t].base[k]*m);if(lv>=7)c.fuel=Math.round(25*m*.35);return c}
const bTime=(t,lv)=>BT[t].t*Math.pow(1.55,lv-1)*(1-.04*S.tech.build)*1000;
function rCost(lv){const m=Math.pow(1.7,lv-1),c={food:Math.round(250*m),wood:Math.round(250*m),iron:Math.round(180*m)};if(lv>=3)c.fuel=Math.round(120*m);return c}
const rTime=lv=>25*Math.pow(1.75,lv-1)*1000;
const gemCost=ms=>ms<=60000?0:Math.ceil(ms/15000);
function heroStats(id){
  const H=HB[id],h=S.heroes[id];
  const base=[0,{a:30,h:420,d:10},{a:44,h:610,d:15},{a:62,h:860,d:22}][H.r];
  const cm={tank:{a:.6,h:1.7,d:1.6},atk:{a:1.35,h:.8,d:.8},sup:{a:.9,h:1,d:1}}[H.c];
  const m=(1+.11*(h.lv-1))*(1+.22*(h.st-1));
  return{atk:base.a*cm.a*m*(1+.04*S.tech.atk),hp:base.h*cm.h*m*(1+.04*S.tech.hp),def:base.d*cm.d*m*(1+.04*S.tech.def)};
}
const heroPower=id=>{const x=heroStats(id);return Math.round(x.atk*3+x.hp*.3+x.def*4)};
const squadPower=()=>S.squad.filter(Boolean).reduce((a,id)=>a+heroPower(id),0);
function troopBonus(){const L=Math.max(1,lvOf('barracks'));return Math.min(1.5,S.troops*(1+.08*(L-1))/2000)}
function totalPower(){
  let p=squadPower()*(1+troopBonus());
  for(const k in S.b)p+=S.b[k].lv*40;
  for(const k in S.tech)p+=S.tech[k]*60;
  return Math.round(p+S.troops*2);
}

const starNeed=st=>[0,10,20,40,80][st]||0;

/* ================= resources ================= */
function canPay(c){for(const k in c)if((S.res[k]||0)<c[k])return false;return true}
function pay(c){for(const k in c)S.res[k]-=c[k]}
function give(r){for(const k in r){if(k in S.res)S.res[k]+=r[k];else if(k in ITEMS)S.inv[k]=(S.inv[k]||0)+r[k];else if(k==='troops')S.troops+=r[k]}}
const GEMRATE={food:120,wood:120,iron:60,fuel:30,exp:40};
function missingGems(c){let g=0;for(const k in c){const miss=c[k]-(S.res[k]||0);if(miss>0)g+=Math.ceil(miss/(GEMRATE[k]||1))}return g}
function costHTML(c){return Object.keys(c).map(k=>`<span class="cc ${(S.res[k]||0)>=c[k]?'':'lack'}">${RES[k].i} ${fmt(c[k])}</span>`).join(' ')}
function rewHTML(r){return Object.keys(r).filter(k=>r[k]).map(k=>{const d=RES[k]||ITEMS[k]||{i:'🪖'};return`<span class="cc">${d.i} ${fmt(r[k])}</span>`}).join(' ')}

function floatAt(el,text){if(!el)return;const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top+10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}

/* ================= actions: buildings ================= */
function bReq(k){
  const p=PLOT[k],to=S.b[k].lv+1,out=[];
  if(to>MAXLV){out.push({ok:false,t:'وصل للمستوى الأقصى'});return out}
  if(p.t!=='hq'&&to>2)out.push({ok:hqLv()>=to-1,t:`مقر القيادة مستوى ${to-1}`});
  if(p.t==='hq'&&to>=3)out.push({ok:S.b.wall.lv>=to-1,t:`السور مستوى ${to-1}`});
  return out;
}
const reqOk=k=>bReq(k).every(r=>r.ok);
function upgrade(k,instant){
  const p=PLOT[k],b=S.b[k],to=b.lv+1;
  if(S.builds.some(x=>x.k===k))return;
  if(!reqOk(k)){toast('المتطلبات غير مكتملة',1);return}
  const c=bCost(p.t,to);
  if(!canPay(c)){toast('الموارد غير كافية',1);return}
  const ms=bTime(p.t,to);
  if(instant){
    const g=gemCost(ms);if(S.res.gems<g){toast('الجواهر غير كافية',1);return}
    pay(c);S.res.gems-=g;finishBuild(k,to);track('build');closeModal();
  }else{
    if(S.builds.length>=maxBuilders()){toast('كل البنائين مشغولين',1);return}
    pay(c);S.builds.push({k,to,st:now(),end:now()+ms,h:0,hr:false});track('build');toast(`بدأ تطوير ${BT[p.t].n}`);
  }
  save();refresh();
}
function finishBuild(k,to){
  S.b[k].lv=to;const t=PLOT[k].t;SND.up();buzz('ok');
  toast(`اكتمل: ${BT[t].n} مستوى ${to} ✅`);
  if(t==='hq'&&PLOTS.some(p=>p.u===to))toast('مبانٍ جديدة صارت متاحة 🔓');
}
function fillRes(ref){
  let c=null;
  if(ref.startsWith('b:')){const k=ref.slice(2);c=bCost(PLOT[k].t,S.b[k].lv+1)}
  else if(ref.startsWith('r:')){const k=ref.slice(2);c=rCost(S.tech[k]+1)}
  if(!c)return;const g=missingGems(c);
  if(S.res.gems<g){toast('الجواهر غير كافية',1);return}
  S.res.gems-=g;for(const k in c)if(S.res[k]<c[k])S.res[k]=c[k];
  toast('تم شراء الموارد الناقصة');save();refresh();
}
function collect(k,el){
  const b=S.b[k],n=Math.floor(b.acc);if(n<1)return 0;
  const r=BT[PLOT[k].t].prod;S.res[r]+=n;b.acc-=n;
  if(el)floatAt(el,`+${fmt(n)} ${RES[r].i}`);
  SND.coin();buzz('light');
  return n;
}
function collectAll(){let any=0;PLOTS.forEach(p=>{if(BT[p.t].prod&&S.b[p.k].lv){const el=document.querySelector(`[data-tile="${p.k}"]`);if(collect(p.k,el))any++}});if(any){track('collect');toast('تم جمع كل الموارد')}else toast('لا توجد موارد للجمع بعد');refresh()}

/* queues */
function getQ(ref){if(ref.startsWith('b:'))return S.builds.find(x=>x.k===ref.slice(2));if(ref==='r')return S.rq;if(ref==='t')return S.tq;return null}
function useSpeed(ref,item){const q=getQ(ref);if(!q)return;if(!S.inv[item]){toast('لا تملك هذا العنصر',1);return}S.inv[item]--;q.end-=item==='sp5'?300000:3600000;toast(`تم استخدام ${ITEMS[item].n}`);processQueues();save();refresh()}
function gemFinish(ref){const q=getQ(ref);if(!q)return;const g=gemCost(q.end-now());if(S.res.gems<g){toast('الجواهر غير كافية',1);return}S.res.gems-=g;q.end=now();processQueues();save();refresh()}
function askHelp(ref){const q=getQ(ref);if(!q||!S.alliance)return;q.hr=true;toast('أرسلت طلب مساعدة للتحالف 🤝');refresh()}
function processQueues(){
  let ch=false;const t=now();
  for(const q of S.builds.slice())if(q.end<=t){S.builds.splice(S.builds.indexOf(q),1);finishBuild(q.k,q.to);ch=true}
  if(S.rq&&S.rq.end<=t){S.tech[S.rq.k]=S.rq.to;toast(`اكتمل البحث: ${TECH[S.rq.k].n} ${S.rq.to} 🔬`);S.rq=null;ch=true}
  if(S.tq&&S.tq.end<=t){S.troops+=S.tq.n;S.stats.trained+=S.tq.n;toast(`انضم ${S.tq.n} جندي للقوات 🎖️`);S.tq=null;ch=true}
  return ch;
}
function allyHelpTick(dt){
  if(!S.alliance)return false;let ch=false;
  for(const q of [...S.builds,S.rq,S.tq]){
    if(!q||!q.hr||q.h>=5)continue;
    if(Math.random()<dt/2500){q.h++;const red=Math.max(60000,(q.end-q.st)*.05);q.end-=red;track('help');toast(`ساعدك ${pick(BOTS)} (−${fmtT(red/1000)})`);ch=true}
  }
  return ch;
}

/* training, hospital, research */
function trainCount(){const L=lvOf('barracks');const room=troopCap(L)-S.troops;return Math.max(0,Math.min(batchMax(L),room))}
function trainCostPer(){const L=Math.max(1,lvOf('barracks'));const m=1+.12*(L-1);return{food:Math.round(10*m),iron:Math.round(5*m)}}
const trainMs=n=>n*1200*(1-.05*S.tech.train);
let trainN=10;
function doTrain(){
  if(S.tq){toast('الثكنة مشغولة',1);return}
  const n=Math.min(trainN,trainCount());if(n<1){toast('وصلت للحد الأقصى من الجنود',1);return}
  const per=trainCostPer(),c={food:per.food*n,iron:per.iron*n};
  if(!canPay(c)){toast('الموارد غير كافية',1);return}
  pay(c);S.tq={n,st:now(),end:now()+trainMs(n),h:0,hr:false};track('train');toast(`بدأ تدريب ${n} جندي`);save();refresh();
}
function doHeal(){
  const n=S.wounded;if(!n)return;const c={food:n*4,wood:n*2};
  if(!canPay(c)){toast('الموارد غير كافية',1);return}
  pay(c);S.troops+=n;S.wounded=0;toast(`تم علاج ${n} جندي 🏥`);save();refresh();
}
function doResearch(k){
  if(S.rq){toast('المختبر مشغول ببحث آخر',1);return}
  const lab=lvOf('lab'),to=S.tech[k]+1;
  if(!lab){toast('ابنِ مختبر الأبحاث أولاً',1);return}
  if(to>10){toast('وصل للمستوى الأقصى');return}
  if(to>lab){toast(`يتطلب مختبر مستوى ${to}`,1);return}
  const c=rCost(to);if(!canPay(c)){toast('الموارد غير كافية',1);return}
  pay(c);S.rq={k,to,st:now(),end:now()+rTime(to),h:0,hr:false};track('research');toast(`بدأ البحث: ${TECH[k].n}`);save();refresh();
}

/* heroes */
function heroLevelUp(id,n){
  const h=S.heroes[id],cap=heroCap(lvOf('tavern'));let done=0;
  while(done<n&&h.lv<cap){const c=lvCost(h.lv);if(S.res.exp<c)break;S.res.exp-=c;h.lv++;done++}
  if(!done){toast(h.lv>=cap?`الحد الأقصى ${cap}. طوّر قاعة الأبطال`:'خبرة الأبطال غير كافية',1);return}
  toast(`${HB[id].n} وصل المستوى ${h.lv} ⬆️`);save();refresh();
}
function heroStar(id){
  const h=S.heroes[id];if(h.st>=5)return;const need=starNeed(h.st);
  if(h.sh<need){toast('الشظايا غير كافية. جنّد نسخاً إضافية',1);return}
  h.sh-=need;h.st++;toast(`${HB[id].n} الآن ${h.st} نجوم ⭐`);save();refresh();
}
let lastPull=[];
function rollHero(){
  S.pity++;let r;const x=Math.random();
  if(S.pity>=40){r=3}else r=x<.05?3:x<.30?2:1;
  if(r===3)S.pity=0;
  const pool=HEROES.filter(h=>h.r===r);return pick(pool).id;
}
function recruit(n){
  let costT=Math.min(S.inv.ticket,n),gem=(n-costT)*150;if(n===10&&costT===0)gem=1350;
  if(S.res.gems<gem){toast('الجواهر أو التذاكر غير كافية',1);return}
  S.inv.ticket-=costT;S.res.gems-=gem;lastPull=[];
  for(let i=0;i<n;i++){const id=rollHero();let isNew=false;if(!S.heroes[id]){S.heroes[id]={lv:1,st:1,sh:0};isNew=true}else S.heroes[id].sh+=10;lastPull.push({id,isNew})}
  S.stats.recruits+=n;track('recruit',n);
  const leg=lastPull.find(p=>HB[p.id].r===3);if(leg){toast(`بطل أسطوري: ${HB[leg.id].n}! 🌟`);SND.rare();buzz('heavy')}else{SND.up();buzz('medium')}
  save();refresh();
}
function squadAdd(id){if(S.squad.includes(id))return;const i=S.squad.indexOf(null);if(i<0){openModal(()=>mSlotPick(id));return}S.squad[i]=id;save();refresh()}
function squadRem(id){const i=S.squad.indexOf(id);if(i<0)return;if(S.squad.filter(Boolean).length<=1){toast('لازم يبقى بطل واحد على الأقل',1);return}S.squad[i]=null;save();refresh()}

/* ================= tick ================= */
let lastTick=now();
function produce(ms){
  const h=ms/3600000;
  PLOTS.forEach(p=>{const T=BT[p.t],b=S.b[p.k];if(!T.prod||!b.lv)return;b.acc=Math.min(storeCap(p.t,b.lv),b.acc+prodRate(p.t,b.lv)*h)});
}
function stamTick(){
  if(S.stam>=100){S.stamAt=now();return}
  while(S.stam<100&&now()-S.stamAt>=180000){S.stam++;S.stamAt+=180000}
}
function tick(){
  const t=now(),dt=clamp(t-lastTick,0,24*3600e3);lastTick=t;
  produce(dt);stamTick();
  let ch=processQueues();
  if(allyHelpTick(dt))ch=true;
  if(marchTick())ch=true;
  if(hqLv()>=2&&t>=S.siegeAt&&!B&&!modalFn){resolveSiege();ch=true}
  if(S.alliance&&t-S.chatAt>45000+Math.random()*40000){S.chatAt=t;S.chat.push({u:pick(BOTS),m:pick(CHATL),t});if(S.chat.length>40)S.chat.shift();if(tab==='alliance')ch=true}
  if(ch)refresh();
  tickUI();
  autosave();
}
function tickUI(){
  renderTop();
  const t=now();
  document.querySelectorAll('[data-end]').forEach(e=>{e.textContent=fmtT((+e.dataset.end-t)/1000)});
  document.querySelectorAll('[data-bar]').forEach(e=>{const st=+e.dataset.st,en=+e.dataset.en;e.style.width=clamp((t-st)/(en-st)*100,0,100)+'%'});
  document.querySelectorAll('[data-gem]').forEach(e=>{const g=gemCost(+e.dataset.gem-t);e.textContent=g?`💎 ${g}`:'إنهاء مجاني'});
  document.querySelectorAll('[data-acc]').forEach(e=>{const k=e.dataset.acc,b=S.b[k],cap=storeCap(PLOT[k].t,b.lv);const show=b.acc>=Math.max(5,cap*.04);e.hidden=!show;if(show)e.lastChild.textContent=fmt(b.acc)});
  document.querySelectorAll('[data-stam]').forEach(e=>e.textContent=Math.floor(S.stam));
}

/* ================= siege ================= */
function resolveSiege(){
  const L=Math.max(1,lvOf('barracks'));
  const def=wallDef(lvOf('wall'))+S.troops*10*(1+.08*(L-1))+squadPower()*.5;
  const horde=Math.round(500*Math.pow(1.42,hqLv()-1)*(.8+Math.random()*.45));
  const win=def>=horde;const rep={win,def:Math.round(def),horde};
  if(win){rep.r={food:Math.round(horde*.8),wood:Math.round(horde*.8),exp:Math.round(horde*.3),gems:25};give(rep.r);S.stats.sieges++}
  else{
    const pr=protect(lvOf('warehouse'));rep.lost={};
    ['food','wood','iron','fuel'].forEach(k=>{const l=Math.floor(Math.max(0,S.res[k]-pr)*.15);if(l){S.res[k]-=l;rep.lost[k]=l}});
    const w=Math.floor(S.troops*.15);S.troops-=w;const room=hospCap(lvOf('hospital'))-S.wounded;const kept=Math.max(0,Math.min(w,room));S.wounded+=kept;rep.w=kept;rep.dead=w-kept;
  }
  S.siegeAt=now()+(16+Math.random()*12)*60e3;save();SND.alarm();buzz(win?'ok':'bad');
  openModal(()=>mSiege(rep));
}

function render(){

  const v=$('#view');const st=v.scrollTop;
  const ci=$('#chatin'),cv=ci?ci.value:'',cf=ci&&document.activeElement===ci;
  v.classList.toggle('fixed',tab==='world');

  if(tab==='alliance'){const c=v.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight;const ni=$('#chatin');if(ni&&cv){ni.value=cv;if(cf)ni.focus()}}

function openModal(fn){modalFn=fn;renderModal(true)}
function renderModal(fresh){
  const m=$('#modal');

  const prev=m.querySelector('.sh-b'),sc=prev&&!fresh?prev.scrollTop:0;
  m.innerHTML=`<div class="sheet" role="dialog">${modalFn()}</div>`;m.hidden=false;

function stageWaves(s){
  const W=[];for(let w=0;w<3;w++){const n=Math.min(28,5+Math.floor(s*.7)+w*2),a=[];
    for(let i=0;i<n;i++){const r=Math.random();let t='w';if(s>=7&&r<.1)t='br';else if(s>=5&&r<.25)t='sp';else if(s>=3&&r<.45)t='run';a.push(t)}
    if(w===2&&s%5===0)a.push('boss');W.push(a)}
  return W;
}

function effText(t,lv){
  const T=BT[t];
  if(T.prod)return`${fmt(prodRate(t,lv))}/ساعة`;
  switch(t){
    case'hq':return`حد المباني ${lv+1}`;
    case'barracks':return`دفعة ${batchMax(lv)} · حد ${fmt(troopCap(lv))}`;
    case'hospital':return`سعة ${fmt(hospCap(lv))}`;
    case'lab':return`أبحاث حتى ${Math.min(10,lv)}`;
    case'wall':return`دفاع ${fmt(wallDef(lv))}`;
    case'warehouse':return`حماية ${fmt(protect(lv))}`;
    case'tavern':return`مستوى الأبطال ${heroCap(lv)}`;
    case'radar':return`مسيرات ${maxMarch(lv)}`;
  }return'';
}

const TS=64,N=25,C=12;

function freeSpot(R){for(let i=0;i<600;i++){const x=Math.floor(R()*N),y=Math.floor(R()*N);if(Math.abs(x-C)<=1&&Math.abs(y-C)<=1)continue;if(S.world.nodes.some(n=>n.x===x&&n.y===y))continue;return{x,y}}return null}
function makeNode(k,R){
  const p=freeSpot(R);if(!p)return null;const d=Math.hypot(p.x-C,p.y-C);
  const n={id:Math.floor(R()*1e9).toString(36)+S.world.nodes.length,x:p.x,y:p.y,k};
  if(k==='z')n.L=clamp(Math.round(d*.75+R()*2.5),1,40);
  if(k==='r'){n.L=clamp(Math.ceil(d/3.2+R()*1.2),1,6);n.rt=['food','wood','iron','fuel'][Math.floor(R()*(n.L>=2?4:3))];n.amt=1500*n.L}
  if(k==='p'){n.name=BOTS[Math.floor(R()*BOTS.length)];n.pw=Math.round((2000+d*900)*(.6+R()*.8));n.tag=ALLIES[Math.floor(R()*3)].tag}
  S.world.nodes.push(n);return n;
}
function genWorld(){S.world.nodes=[];const R=rng(S.world.seed);for(let i=0;i<70;i++)makeNode('z',R);for(let i=0;i<45;i++)makeNode('r',R);for(let i=0;i<10;i++)makeNode('p',R)}
const nodeById=id=>S.world.nodes.find(n=>n.id===id);
const marchSpd=()=>1+.08*S.tech.march;
function startGather(id){
  const n=nodeById(id);if(!n)return;
  if(S.world.marches.length>=maxMarch(lvOf('radar'))){toast('كل المسيرات مشغولة. طوّر الرادار',1);return}
  if(S.world.marches.some(m=>m.nid===id)){toast('عندك مسيرة هنا',1);return}
  const d=Math.hypot(n.x-C,n.y-C),travel=d*5000/marchSpd(),gath=n.amt/(40*marchSpd())*1000,t=now();
  S.world.marches.push({nid:id,x:n.x,y:n.y,rt:n.rt,amt:n.amt,go:t,arr:t+travel,fin:t+travel+gath,back:t+travel*2+gath});
  toast('انطلقت المسيرة 🚚');closeModal();save();refresh();
}

      const i=S.world.nodes.findIndex(n=>n.id===m.nid);if(i>=0){S.world.nodes.splice(i,1);makeNode('r',Math.random)}ch=true}

    c.font=`${s}px serif`;const wob=Math.sin(B.t*6+z.ph)*.08;c.save();c.translate(z.x,z.y);c.rotate(z.stun>0?0:wob);c.fillText(z.T.i,0,0);c.restore();
    if(z.flash>0){c.fillStyle='#fff6';c.beginPath();c.arc(z.x,z.y,z.T.r,0,7);c.fill()}
    if(z.stun>0){c.font='14px serif';c.fillText('💫',z.x,z.y-z.T.r-10)}
    if(z.hp<z.maxhp){const w=z.T.r*2;c.fillStyle='#000a';c.fillRect(z.x-w/2,z.y-z.T.r-6,w,4);c.fillStyle=z.type==='boss'?'#e2513f':'#c9453a';c.fillRect(z.x-w/2,z.y-z.T.r-6,w*Math.max(0,z.hp/z.maxhp),4)}
  }
  for(const h of B.heroes){
    const col={tank:'#3f6f96',atk:'#9c3f2f',sup:'#3f8a5c'}[h.H.c],rc=['','#4f8fd6','#a66be0','#e8a62d'][h.H.r];
    c.globalAlpha=h.alive?1:.25;
    c.fillStyle='#0008';c.beginPath();c.ellipse(h.x,h.y+18,18,6,0,0,7);c.fill();
    c.fillStyle=col;c.beginPath();c.arc(h.x,h.y,18,0,7);c.fill();c.lineWidth=3;c.strokeStyle=rc;c.stroke();
    c.fillStyle='#fff';c.font='800 17px Changa, sans-serif';c.fillText(h.H.n[0],h.x,h.y+1);
    if(h.flash>0){c.fillStyle='#e2513f66';c.beginPath();c.arc(h.x,h.y,18,0,7);c.fill()}
    if(h.shield>0){c.strokeStyle='#5aa6d6';c.lineWidth=2;c.globalAlpha=.6+Math.sin(B.t*8)*.2;c.beginPath();c.arc(h.x,h.y,25,0,7);c.stroke();c.globalAlpha=1}
    if(h.rapid>0){c.strokeStyle='#f1b23c';c.lineWidth=2;c.beginPath();c.arc(h.x,h.y,22,B.t*10,B.t*10+2);c.stroke()}
    if(h.alive){c.fillStyle='#000a';c.fillRect(h.x-18,h.y+23,36,4);c.fillStyle='#64b66e';c.fillRect(h.x-18,h.y+23,36*h.hp/h.maxhp,4)}
    c.globalAlpha=1;
  }
  for(const f of B.fx){
    if(f.t<0)continue;const p=f.t/f.life;
    if(f.k==='tr'){c.strokeStyle=f.col;c.globalAlpha=1-p;c.lineWidth=f.w;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.tx,f.ty);c.stroke();c.globalAlpha=1}
    else if(f.k==='txt'){c.globalAlpha=1-p*p;c.font=`800 ${f.big?17:13}px Changa, sans-serif`;c.lineWidth=3;c.strokeStyle='#000';c.strokeText(f.s,f.x,f.y-p*28);c.fillStyle=f.col;c.fillText(f.s,f.x,f.y-p*28);c.globalAlpha=1}
    else if(f.k==='die'){c.globalAlpha=1-p;c.fillStyle='#5a7a4a';for(let i=0;i<6;i++){const a=i*1.05;c.beginPath();c.arc(f.x+Math.cos(a)*p*f.r*1.4,f.y+Math.sin(a)*p*f.r*1.4,4*(1-p)+1,0,7);c.fill()}c.globalAlpha=1}
    else if(f.k==='boom'){c.globalAlpha=1-p;const g=c.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*(.4+p*.6));g.addColorStop(0,'#fff3c0');g.addColorStop(.4,'#f1b23c');g.addColorStop(1,'#cf6a2c00');c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,f.r*(.4+p*.6),0,7);c.fill();c.globalAlpha=1}
    else if(f.k==='spit'){const x=f.x+(f.tx-f.x)*p,y=f.y+(f.ty-f.y)*p-Math.sin(p*Math.PI)*40;c.fillStyle='#8fcf3a';c.beginPath();c.arc(x,y,5,0,7);c.fill()}
    else if(f.k==='heal'){c.globalAlpha=1-p;c.strokeStyle='#64b66e';c.lineWidth=3;c.beginPath();c.arc(f.x,f.y,18+p*20,0,7);c.stroke();c.globalAlpha=1}
    else if(f.k==='claw'){c.globalAlpha=1-p;c.strokeStyle='#e2513f';c.lineWidth=2;for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(f.x+i*6-6,f.y-6);c.lineTo(f.x+i*6+6,f.y+6);c.stroke()}c.globalAlpha=1}
  }
  const fog=c.createLinearGradient(0,0,0,90);fog.addColorStop(0,'#0b0e10');fog.addColorStop(1,'#0b0e1000');c.fillStyle=fog;c.fillRect(0,0,W,90);
  c.font='700 12px Changa, sans-serif';c.fillStyle='#8e99a2';c.textAlign='left';c.fillText(`⏱ ${Math.max(0,Math.ceil(150-B.t))}`,10,14);c.textAlign='right';c.fillText(`🧟 ${B.kills}`,W-10,14);
}
function bCards(){for(const h of B.heroes){if(!h.card)continue;h.hpI.style.width=(h.hp/h.maxhp*100)+'%';h.enI.style.width=h.en+'%';h.card.classList.toggle('ready',h.alive&&h.en>=100&&!S.auto&&!B.done);h.card.classList.toggle('dead',!h.alive)}}
function bLoop(ts){
  if(!B)return;const dt=B.last?Math.min(.05,(ts-B.last)/1000):0;B.last=ts;
  if(!B.done)for(let i=0;i<S.spd&&!B.done;i++)bStep(dt);
  bDraw();bCards();B.raf=requestAnimationFrame(bLoop);
}
function bEnd(win,why){
  if(B.done)return;B.done=true;
  const lostFrac=clamp(B.dmgTaken/B.maxTotal,0,1);
  let wounded=Math.round(S.troops*(.1*lostFrac+(win?0:.06)));S.troops-=wounded;
  const room=Math.max(0,hospCap(lvOf('hospital'))-S.wounded),kept=Math.min(wounded,room);S.wounded+=kept;const dead=wounded-kept;
  S.stats.kills+=B.kills;
  let rew=null;
  if(win){S.stats.wins++;track('win')}
  setTimeout(win?SND.win:SND.lose,200);buzz(win?'ok':'bad');
  rew=B.cfg.onEnd(win,B);
  save();
  const el=$('#b-res');el.hidden=false;el.className='result '+(win?'win':'lose');
  el.innerHTML=`<div class="panel"><h2>${win?'انتصار!':'هزيمة'}</h2><div class="muted">${why||(win?`قتلت ${B.kills} زومبي`:'سقط كل الأبطال')}</div>
  ${rew?`<div class="row" style="justify-content:center">${rewHTML(rew)}</div>`:''}
  ${wounded?`<div class="muted" style="font-size:13px">جرحى ${kept} → المستشفى${dead?` · قتلى ${dead}`:''}</div>`:''}
  ${!win?'<p class="muted" style="font-size:13px">طوّر الأبطال بالخبرة، ارفع النجوم، أو درّب جنوداً أكثر.</p>':''}
  <div class="grid2" style="width:100%">${win&&B.cfg.next?`<button class="btn" id="b-cont">رجوع</button><button class="btn pri" id="b-next">المرحلة التالية</button>`:`<button class="btn pri" id="b-cont" style="grid-column:1/-1">متابعة</button>`}</div></div>`;
  $('#b-cont').onclick=closeBattle;
  const nx=$('#b-next');if(nx)nx.onclick=()=>{closeBattle();startCampaign()};
}
function closeBattle(){if(!B)return;cancelAnimationFrame(B.raf);B=null;$('#battle').hidden=true;refresh()}
function startCampaign(){
  const s=S.stage;
  startBattle({title:`الحملة · المرحلة ${s}`,waves:stageWaves(s),sc:s,next:true,onEnd:win=>{if(!win)return null;const r=stageReward(s);give(r);S.stage=s+1;return r}});
}
$('#b-cards').addEventListener('click',e=>{const el=e.target.closest('.bc');if(!el||!B)return;const h=B.heroes.find(x=>x.slot===+el.dataset.slot);if(h)cast(h)});
$('#b-spd').onclick=()=>{S.spd=S.spd===1?2:1;$('#b-spd').textContent='×'+S.spd;$('#b-spd').classList.toggle('on',S.spd>1)};
$('#b-auto').onclick=()=>{S.auto=!S.auto;$('#b-auto').classList.toggle('on',S.auto)};
$('#b-quit').onclick=()=>{if(!B||B.done)return;if(B.quitArm>now()){bEnd(false,'انسحبت من المعركة')}else{B.quitArm=now()+2500;$('#b-quit').textContent='متأكد؟';setTimeout(()=>{if(B&&!B.done)$('#b-quit').textContent='انسحاب'},2500)}};

/* ================= action dispatch ================= */
function claimQuest(){const q=QUESTS[S.quest];if(!q||!q[1]())return;give(q[2]);S.quest++;toast('تم استلام المكافأة 🎉');save();refresh()}
function goQuest(){const q=QUESTS[S.quest];if(!q)return;const g=q[3];closeModal();if(g.startsWith('#')){tab=g.slice(1);render();return}const p=PLOT[g];if(hqLv()<p.u){toast(`يفتح عند المقر ${p.u}`);openModal(()=>mBuilding('hq'));return}tab='base';render();openModal(()=>mBuilding(g))}
const ACT={
  tab:x=>{closeModal();tab=x;render()},
  close:()=>closeModal(),
  bld:x=>openModal(()=>mBuilding(x)),
  locked:x=>toast(`يفتح عند مقر القيادة مستوى ${x}`),
  collect:(x,el)=>{if(collect(x,el.closest('.tile')))track('collect');tickUI()},
  collect1:x=>{if(collect(x,document.querySelector(`[data-tile="${x}"]`)))track('collect');refresh()},
  collectAll:()=>collectAll(),
  up:x=>upgrade(x,false),inst:x=>upgrade(x,true),fill:x=>fillRes(x),
  usesp:x=>{const[r,i]=x.split('|');useSpeed(r,i)},gemfin:x=>gemFinish(x),help:x=>askHelp(x),
  helpAll:()=>{let n=0;for(const q of [...S.builds,S.rq,S.tq])if(q&&!q.hr){q.hr=true;n++}toast(n?`طلبت المساعدة لـ ${n} مؤقت`:'لا توجد مؤقتات تحتاج مساعدة');refresh()},
  train:()=>doTrain(),heal:()=>doHeal(),research:x=>doResearch(x),
  hero:x=>openModal(()=>mHero(x)),hlv:x=>{const[id,n]=x.split('|');heroLevelUp(id,+n)},hstar:x=>heroStar(x),
  sqadd:x=>squadAdd(x),sqrem:x=>squadRem(x),
  slot:x=>openModal(()=>mSlot(+x)),
  slotset:x=>{const[i,id]=x.split('|');const j=S.squad.indexOf(id);if(j>=0)S.squad[j]=S.squad[+i];S.squad[+i]=id;save();closeModal();refresh()},
  slotclr:x=>{if(S.squad.filter(Boolean).length<=1){toast('لازم يبقى بطل واحد على الأقل',1);return}S.squad[+x]=null;save();closeModal();refresh()},
  openRecruit:()=>{lastPull=[];openModal(mRecruit)},recruit:x=>recruit(+x),
  fight:()=>startCampaign(),
  attackNode:x=>attackNode(x),gather:x=>startGather(x),
  recenter:()=>{cam={x:C*TS+TS/2,y:C*TS+TS/2}},
  qclaim:()=>claimQuest(),qgo:()=>goQuest(),quests:()=>openModal(mQuests),
  events:()=>openModal(mEvents),
  login:()=>{if(S.login.last===today())return;const r=LOGIN[S.login.day%7];give(r);S.login.day++;S.login.last=today();toast('استلمت مكافأة الدخول 🎁');save();refresh()},
  dclaim:x=>{ensureDaily();const d=DAILY.find(d=>d.k===x);if(!d||S.daily.c[x]||(S.daily.p[x]||0)<d.g)return;S.daily.c[x]=1;S.res.gems+=10;toast('+15 نقطة · +10 💎');save();refresh()},
  chest:x=>{const c=CHESTS[+x];if(dailyPoints()<c.p||S.daily.c['chest'+x])return;S.daily.c['chest'+x]=1;give(c.r);toast('فتحت صندوق النشاط 🎁');save();refresh()},
  shop:()=>openModal(mShop),
  buy:x=>{const s=SHOP.find(s=>s.k===x);if(!s)return;if(x==='free'){if(S.freeBox===today())return;S.freeBox=today()}else{if(S.res.gems<s.p){toast('الجواهر غير كافية',1);return}S.res.gems-=s.p}give(s.r);toast(`تم: ${s.n}`);save();refresh()},
  bag:()=>openModal(mBag),
  useStam:()=>{if(!S.inv.stam)return;S.inv.stam--;S.stam=Math.min(150,S.stam+50);toast('+50 طاقة ⚡');save();refresh()},
  settings:()=>openModal(mSettings),
  tsnd:()=>{S.snd=!S.snd;save();renderModal();if(S.snd)SND.coin()},
  tvib:()=>{S.vib=!S.vib;save();renderModal();buzz('medium')},tut:()=>openModal(mTut),
  reset:()=>{if(resetArm>now()){try{localStorage.removeItem(KEY)}catch(e){}S=newState();S.tut=true;resetArm=0;cam=null;closeModal();tab='base';save(true);refresh();toast('بدأت لعبة جديدة')}else{resetArm=now()+3000;renderModal();setTimeout(()=>{if(modalFn===mSettings)renderModal()},3100)}},
  join:x=>{const i=+x,a=ALLIES[i];const m=BOTS.slice().sort(()=>Math.random()-.5).slice(0,8+a.lv%4).map((n,j)=>({n,p:Math.round((60000-j*5000)*(.6+Math.random()*.6))})).sort((p,q)=>q.p-p.p);S.alliance={i,m,gift:''};S.chat=[{u:m[0].n,m:`حيّاك الله في ${a.n}! 👋`,t:now()}];S.chatAt=now();toast(`انضممت إلى ${a.n}`);save();refresh()},
  leave:(x,el)=>{if(el.dataset.arm){S.alliance=null;S.chat=[];toast('غادرت التحالف');save();refresh()}else{el.dataset.arm='1';el.textContent='اضغط مرة ثانية للتأكيد';el.style.background='var(--bad)'}},
  gift:()=>{if(!S.alliance||S.alliance.gift===today())return;S.alliance.gift=today();const r={gems:60,food:3000,wood:3000,sp5:2};give(r);toast('استلمت هدية التحالف 🎁');save();refresh()},
};
document.addEventListener('click',e=>{
  const m=$('#modal');if(e.target===m){closeModal();return}
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.dataset.a!=='collect')SND.click();
  const f=ACT[el.dataset.a];if(f){e.stopPropagation();f(el.dataset.x,el,e)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalFn)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{
  if(e.target.id==='trn'){trainN=+e.target.value;$('#trnv').textContent=trainN;const per=trainCostPer();$('#trnc').innerHTML=`${costHTML({food:per.food*trainN,iron:per.iron*trainN})} <span class="cc">⏱ ${fmtT(trainMs(trainN)/1000)}</span>`}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='chatf'){const i=$('#chatin');const v=i.value.trim();if(!v)return;S.chat.push({me:true,m:v,t:now()});if(S.chat.length>40)S.chat.shift();i.value='';
    setTimeout(()=>{if(!S.alliance)return;S.chat.push({u:pick(S.alliance.m).n,m:pick(['😂👍','صح كلامك','تم يا بطل','الله يوفقك','أنا معك','💪💪']),t:now()});if(tab==='alliance')render()},1500+Math.random()*2500);save();render()}
  if(e.target.id==='namef'){const v=$('#namein').value.trim().slice(0,16);if(v){S.name=v;save();toast('تم حفظ الاسم');refresh()}}
});
window.addEventListener('resize',()=>{if(tab==='world')sizeWorld();if(B){bResize();bBg()}});

/* ================= save ================= */
const KEY='fajr-naajin-save-v1';
let cloud=null,cloudBusy=false,lastCloud=0,lastLocal=0;
function save(force){
  S.savedAt=now();lastLocal=S.savedAt;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(force)pushCloud();
}
function autosave(){const t=now();if(t-lastLocal>5000)save();if(cloud&&t-lastCloud>45000)pushCloud()}
async function pushCloud(){
  if(!cloud||cloudBusy)return;cloudBusy=true;lastCloud=now();
  try{await cloud.set({savedAt:S.savedAt,data:JSON.stringify(S)})}catch(e){}
  cloudBusy=false;
}
function loadLocal(){try{const raw=localStorage.getItem(KEY);if(raw)return migrate(JSON.parse(raw))}catch(e){}return null}
function catchUp(st){
  const off=clamp(now()-st.savedAt,0,24*3600e3);
  const prev=S;S=st;produce(off);
  if(S.siegeAt<now())S.siegeAt=now()+5*60e3;
  if(off>60000&&prev!==st)return off;return off;
}
async function connectCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const[d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u)return;const id=await u.id();if(!id)return;
    const ref=d.doc(`data/users/${id}/saves/main`);
    const snap=await ref.get();
    cloud=ref;
    if(snap.exists){const r=snap.data();if(r&&r.data&&(r.savedAt||0)>(S.savedAt||0)+3000){try{const st=migrate(JSON.parse(r.data));const off=catchUp(st);lastTick=now();save();refresh();toast('تم تحميل تقدمك من حسابك ☁️');if(off>60000)toast(`المباني أنتجت أثناء غيابك (${fmtT(off/1000)})`)}catch(e){}}}
    else pushCloud();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();pushCloud()}});
try{const P=window.Capacitor&&window.Capacitor.Plugins;if(P){if(P.App&&P.App.addListener)P.App.addListener('pause',()=>{save()});if(P.StatusBar&&P.StatusBar.setStyle)P.StatusBar.setStyle({style:'DARK'}).catch(()=>{})}}catch(e){}

/* ================= boot ================= */
function start(data){
  let off=0;
  if(data&&data.S){S=migrate(data.S);if(typeof data.tab==='string')tab=data.tab}
  else{const st=loadLocal();if(st){off=catchUp(st)}else S=newState()}
  lastTick=now();ensureDaily();
  if(!S.world.nodes)genWorld();
  render();
  if(!S.tut){S.tut=true;openModal(mTut)}
  else if(off>60000)toast(`المباني أنتجت أثناء غيابك (${fmtT(off/1000)})`);
  setInterval(tick,250);
  connectCloud();
}
try{window.claude?.hot?.snapshot?.(()=>({S,tab}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
})();
</script>
