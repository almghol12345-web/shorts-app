<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Fajr Survivors</title>
<style>
@font-face{font-family:'Changa';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/changa-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}

@font-face{font-family:'Changa';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/changa-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Changa';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/changa-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Changa';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/changa-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Changa';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/changa-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}

@font-face{font-family:'Tajawal';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/tajawal-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Tajawal';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/tajawal-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Tajawal';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/tajawal-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Tajawal';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/tajawal-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Tajawal';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/tajawal-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:'Tajawal';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/tajawal-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
img{max-width:100%}
/* Layout: one-screen phone game. Resource bar on top, one swappable view, tab bar at the bottom. Battles open as a full-screen canvas. Single dark look by design: asphalt, rust and sodium-lamp amber. All side-specific spacing uses logical properties so Arabic (RTL) and English (LTR) mirror cleanly. */
:root{
  --bg:#0e1215; --ground:#151b1f; --panel:#1a2127; --panel2:#232c34; --line:#33404a;
  --fg:#ece5d7; --muted:#8e99a2; --rust:#cf6a2c; --rust2:#a9521f; --amber:#f1b23c;
  --good:#64b66e; --bad:#e2513f; --sky:#5aa6d6; --vip:#e7c26a;
  --r1:#4f8fd6; --r2:#a66be0; --r3:#e8a62d;
  --tank:#3f6f96; --atk:#9c3f2f; --sup:#3f8a5c;
  --fd:'Changa',system-ui,sans-serif; --fb:'Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select,textarea{font:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto;position:relative;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.top{background:linear-gradient(180deg,#1c252b,#141a1e);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.top-r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.me .av{width:40px;height:40px;font-size:18px}
.avw{position:relative;flex:none}
.avw .clv{position:absolute;bottom:-4px;inset-inline-end:-4px;background:var(--amber);color:#2a1a04;font-family:var(--fd);font-weight:800;font-size:10px;border-radius:7px;padding:0 4px;line-height:15px;border:2px solid #141a1e}
.me-t{display:grid;text-align:start;min-width:0;gap:1px}
.me-t b{font-family:var(--fd);font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-t small{color:var(--amber);font-size:12px;font-family:var(--fd)}
.xpb{height:4px;width:90px;background:#0b0f12;border-radius:3px;overflow:hidden}
.xpb i{display:block;height:100%;background:var(--sky)}
.topbtns{display:flex;align-items:center;gap:6px}
.vipb{font-family:var(--fd);font-weight:800;font-size:12px;color:#2a1a04;background:linear-gradient(180deg,#f5d98a,#c99a35);border-radius:8px;padding:3px 7px}
.gem{display:flex;align-items:center;gap:6px;background:#10161a;border:1px solid var(--line);border-radius:20px;padding-block:4px;padding-inline:12px 6px;font-family:var(--fd);font-weight:700}
.gem i{font-style:normal;background:var(--rust);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;line-height:1}
.resrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rc{display:flex;align-items:center;gap:4px;background:#0f1518;border:1px solid #27323b;border-radius:8px;padding:3px 6px;font-family:var(--fd);font-size:13px;font-weight:600;min-width:0}
.rc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* view & tabs */
#view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
#view.fixed{overflow:hidden}
.pad{padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#12181c;border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:grid;justify-items:center;gap:1px;padding:7px 2px 6px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.tab .ti{font-size:21px;line-height:1.1;filter:grayscale(.7);opacity:.75}
.tab.on{color:var(--amber)}
.tab.on .ti{filter:none;opacity:1}
.tab.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--rust);border-radius:0 0 3px 3px}
.dot{position:absolute;top:5px;inset-inline-start:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px #12181c}

/* generic */
h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700;color:var(--muted);letter-spacing:.02em}
p{margin:0;line-height:1.6}
.muted{color:var(--muted)}
.sm{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:800;font-family:var(--fd);font-size:15px;min-height:44px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#dc7533,#b2561f);border-color:#e58a4a;color:#fff;text-shadow:0 1px 0 #0005}
.btn.gold{background:linear-gradient(180deg,#f3c255,#cf9324);border-color:#f7d27a;color:#2a1a04}
.btn.ok{background:linear-gradient(180deg,#6cbf74,#3f8d4a);border-color:#86d18d;color:#08200c}
.btn.danger{background:linear-gradient(180deg,#e2614f,#a8372a);border-color:#f08070;color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.btn.hint{animation:hint 1.1s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 0 4px #f1b23c66;transform:scale(1.04)}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.cc{display:inline-flex;align-items:center;gap:3px;background:#0f1518;border:1px solid #2a353e;border-radius:7px;padding:2px 7px;font-family:var(--fd);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cc.lack{color:var(--bad);border-color:#5a2a24}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:#0f1518;border:1px solid var(--line);font-family:var(--fd);letter-spacing:.02em}
.tag.live{background:#3a1512;border-color:#7c2a22;color:#ffb3a6}
.prog{height:8px;background:#0b0f12;border-radius:5px;overflow:hidden;border:1px solid #27323b}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--rust));border-radius:5px}
[dir=rtl] .prog i{background:linear-gradient(270deg,var(--amber),var(--rust))}
.req{display:flex;gap:6px;align-items:center;font-size:14px}
.req.no{color:var(--bad)}
.req.yes{color:var(--good)}
.field{flex:1;min-width:0;width:100%;background:#0f1518;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);user-select:text;-webkit-user-select:text}
textarea.field{min-height:70px;resize:vertical}
label.lbl{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}

/* base */
.base-wrap{display:grid;gap:12px;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.quest{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#2a2014,#1b2228);border:1px solid #5b4524;border-radius:12px;padding:8px 10px}
[dir=rtl] .quest{background:linear-gradient(270deg,#2a2014,#1b2228)}
.quest .qk{font-family:var(--fd);font-size:11px;font-weight:800;color:#2a1a04;background:var(--amber);border-radius:6px;padding:2px 7px;flex:none}
.quest .qt{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.banner{display:flex;align-items:center;gap:8px;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.banner.siege{background:#3a1512;border:1px solid #7c2a22;color:#ffd2c8;animation:pulse 1.2s infinite}
.banner.ev{background:linear-gradient(90deg,#2b1d3a,#1b2228);border:1px solid #5d4a8a;color:#e2d6ff}
.banner.offer{background:linear-gradient(90deg,#3a2a12,#1b2228);border:1px solid #8a6a2a;color:#ffe7b0}
.banner .grow{flex:1;min-width:0}
@keyframes pulse{50%{background:#521c17}}
.shortcuts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px}
.sc{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative;text-align:center;line-height:1.2}
.sc .si{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--panel2);border:1px solid var(--line)}
.sc .dot{top:-2px;inset-inline-start:calc(50% + 12px)}
.compound{position:relative;border-radius:18px;padding:12px;background:
  radial-gradient(ellipse at 50% 0%,#2a2a22 0,transparent 60%),
  repeating-linear-gradient(115deg,transparent 0 38px,#ffffff05 38px 40px),
  repeating-linear-gradient(25deg,transparent 0 61px,#00000030 61px 63px),
  #1a1f21;border:3px solid #3b3a33;box-shadow:inset 0 0 0 3px #232320,inset 0 0 40px #000a;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:hidden}
.compound::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0000 60%,#0e121588)}
.tile{position:relative;display:grid;justify-items:center;align-content:center;gap:2px;aspect-ratio:1/1;max-width:100%;background:radial-gradient(circle at 50% 40%,#2d3438 0,#20262a 70%);border:1px solid #3a444b;border-radius:14px;padding:6px 4px;text-align:center;cursor:pointer;z-index:1}
.tile:active{transform:scale(.97)}
.tile.hq{grid-column:1/-1;aspect-ratio:auto;min-height:118px;background:radial-gradient(circle at 50% 35%,#3b3424 0,#22262a 70%);border-color:#6a5530}
.tile.hq .ti{font-size:52px}
.tile .ti{font-size:34px;line-height:1.1;filter:drop-shadow(0 4px 3px #000a)}
.tile .ti.dim{filter:grayscale(1) brightness(.6);opacity:.6}
.tile .tn{font-size:12px;font-weight:800;line-height:1.2;font-family:var(--fd)}
.tile .ts{font-size:11px;color:var(--muted);font-weight:700}
.tile .lv{position:absolute;top:5px;inset-inline-end:6px;background:#0d1114;border:1px solid #45525c;color:var(--amber);font-family:var(--fd);font-size:11px;font-weight:800;border-radius:6px;padding:0 5px;line-height:17px}
.tile .upok{position:absolute;top:5px;inset-inline-start:6px;width:18px;height:18px;border-radius:50%;background:var(--good);color:#04200a;font-size:12px;font-weight:900;display:grid;place-items:center;line-height:1}
.tile.empty{background:transparent;border:2px dashed #3d4950}
.tile.locked{background:#14181b;border-color:#242b30;opacity:.7}
.tile .tbar{position:absolute;bottom:6px;left:8px;right:8px;height:6px}
.tile .tt{position:absolute;bottom:13px;left:0;right:0;font-size:11px;font-weight:800;color:var(--amber);font-family:var(--fd)}
.tile.busy .ti{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bub{position:absolute;top:-6px;inset-inline-start:-4px;display:flex;align-items:center;gap:2px;background:#f4ecd8;color:#20170c;border-radius:14px;padding:2px 7px 2px 6px;font-family:var(--fd);font-weight:800;font-size:12px;box-shadow:0 3px 8px #000a;z-index:2;animation:bubin .3s}
@keyframes bubin{from{transform:scale(.4)}}
.builders{display:grid;gap:6px}
.bq{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;text-align:start}
.bq .prog{flex:1}
.float{position:fixed;z-index:60;pointer-events:none;font-family:var(--fd);font-weight:800;color:var(--amber);text-shadow:0 2px 3px #000;animation:floatup 1s ease-out forwards}
@keyframes floatup{to{transform:translateY(-50px);opacity:0}}

/* heroes */
.av{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--fd);font-weight:800;color:#fff;flex:none;width:44px;height:44px;font-size:20px;border:3px solid var(--r1);text-shadow:0 1px 2px #0008}
.av.r2{border-color:var(--r2)} .av.r3{border-color:var(--r3);box-shadow:0 0 10px #e8a62d66}
.av.c-tank{background:radial-gradient(circle at 35% 30%,#6c9cc4,var(--tank))}
.av.c-atk{background:radial-gradient(circle at 35% 30%,#d06a52,var(--atk))}
.av.c-sup{background:radial-gradient(circle at 35% 30%,#73c08f,var(--sup))}
.av.c-me{background:radial-gradient(circle at 35% 30%,#e4884a,var(--rust2));border-color:var(--amber)}
.formation{background:linear-gradient(180deg,#1b2228,#151b1f);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.frow{display:flex;justify-content:center;gap:12px}
.slot{width:70px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:700}
.slot .av{width:58px;height:58px;font-size:24px}
.slot .empty{width:58px;height:58px;border-radius:50%;border:2px dashed #4a5660;display:grid;place-items:center;color:var(--muted);font-size:24px}
.flabel{font-size:11px;color:var(--muted);text-align:center;font-weight:700;letter-spacing:.04em}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hc{position:relative;display:grid;justify-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px 8px;text-align:center}
.hc.r3{background:linear-gradient(180deg,#2c2416,var(--panel))}
.hc.r2{background:linear-gradient(180deg,#261d30,var(--panel))}
.hc .av{width:52px;height:52px;font-size:22px}
.hc b{font-family:var(--fd);font-size:14px}
.hc small{font-size:11px;color:var(--muted);font-weight:700}
.hc .in{position:absolute;top:6px;inset-inline-start:6px;font-size:10px;background:var(--rust);color:#fff;border-radius:5px;padding:0 5px;font-weight:800}
.hc .dot{top:6px;inset-inline-end:6px;inset-inline-start:auto}
.hc.lockd{opacity:.45}
.hc.lockd .av{background:#20272c;color:#56626b}
.stars{color:var(--amber);font-size:12px;letter-spacing:-1px;line-height:1}
.stars .off{color:#3b464e}
.stat{background:#10161a;border:1px solid #27323b;border-radius:10px;padding:8px;display:grid;gap:2px;text-align:center;min-width:0}
.stat small{color:var(--muted);font-size:11px;font-weight:700}
.stat b{font-family:var(--fd);font-size:17px;overflow:hidden;text-overflow:ellipsis}
.pull{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pull .hc{padding:6px 2px;animation:flip .45s backwards}
@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.pull .hc .av{width:40px;height:40px;font-size:17px}
.pull .new{position:absolute;top:2px;inset-inline-start:2px;font-size:9px;background:var(--good);color:#04200a;border-radius:4px;padding:0 4px;font-weight:800}

/* campaign */
.stagecard{background:
  linear-gradient(180deg,#0000,#0e1215 85%),
  repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 46px),
  radial-gradient(ellipse at 50% 0%,#5a2a1a 0,#1a1f22 70%);
  border:1px solid #5b3322;border-radius:16px;padding:16px;display:grid;gap:12px;text-align:center}
.stagecard .big{font-family:var(--fd);font-size:44px;font-weight:800;line-height:1;color:var(--amber);text-shadow:0 3px 0 #0008}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}

.path{display:grid;gap:8px}

.pn.done{opacity:.55}
.pn.done .pi{border-color:var(--good);color:var(--good)}
.pn.cur{border-color:var(--rust);background:#2a1d16}

/* world */
.world{position:absolute;inset:0}
.world canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

.chip{background:#0e1215e6;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--fd);font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center}
.wtools{position:absolute;inset-inline-end:max(12px,env(safe-area-inset-right,0px));top:58px;display:grid;gap:8px}
.wtools button{width:44px;height:44px;border-radius:12px;background:#0e1215e6;border:1px solid var(--line);font-size:20px;font-weight:800;display:grid;place-items:center}
.wmarch{position:absolute;bottom:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:6px;pointer-events:none}
.wmarch .bq{background:#0e1215e6;pointer-events:auto}

/* alliance & lists */
.msg{display:grid;gap:2px;background:var(--panel2);border-radius:12px;border-end-start-radius:4px;padding:7px 10px;max-width:85%;justify-self:start}
.msg.mine{justify-self:end;background:#3a2418;border-radius:12px;border-end-end-radius:4px}
.msg b{font-size:12px;color:var(--amber);font-family:var(--fd)}
.msg span{font-size:14px;line-height:1.45;word-break:break-word;user-select:text;-webkit-user-select:text}
.chat{display:grid;gap:6px;max-height:300px;overflow-y:auto;padding:4px}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #26313a;font-weight:700;font-size:14px}
.mem:last-child{border:0}
.mem .av{width:34px;height:34px;font-size:15px}
.mem .p{margin-inline-start:auto;color:var(--amber);font-family:var(--fd);font-size:13px}
.mem .rk{width:28px;text-align:center;font-family:var(--fd);font-weight:800;color:var(--muted)}
.mem.me{background:#2a1d16;border-radius:10px;padding-inline:8px}
.ally{display:flex;align-items:center;gap:12px}
.flag{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:15px;color:#fff;flex:none;border:2px solid #fff3}

/* modal */
#modal{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
#modal.full{align-items:stretch}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:620px;max-height:90%;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--rust);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #000;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
#modal.full .sheet{max-height:none;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
@keyframes up{from{transform:translateY(40px)}}
.sh-h{display:flex;align-items:center;gap:12px;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sh-h .hi{font-size:34px;line-height:1}
.sh-h .htx{flex:1;min-width:0}
.sh-h .x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:18px;display:grid;place-items:center;flex:none}
.sh-b{overflow-y:auto;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;align-content:start}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subtabs button{flex:none;padding:7px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:13px;font-family:var(--fd)}
.subtabs button.on{background:var(--rust);border-color:#e58a4a;color:#fff}
.eff{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;background:#10161a;border:1px solid #27323b;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.eff .arr{color:var(--rust)}
.eff .nx{color:var(--good)}
.li{display:flex;align-items:center;gap:10px;background:#10161a;border:1px solid #27323b;border-radius:12px;padding:10px;text-align:start;min-width:0}
.li .lic{font-size:26px;width:40px;text-align:center;flex:none}
.li .lit{flex:1;min-width:0;display:grid;gap:3px}
.li .lit b{font-family:var(--fd);font-size:14px}
.li .lit small{color:var(--muted);font-size:12px}
.li.hot{border-color:#8a6a2a;background:linear-gradient(90deg,#2d2414,#10161a)}
input[type=range]{width:100%;accent-color:var(--rust)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:grid;justify-items:center;gap:2px;background:#10161a;border:1px solid #27323b;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:700}
.day .d1{font-size:20px}
.day.got{opacity:.4}
.day.now{border-color:var(--amber);background:#2d2414}
.result{position:absolute;inset:0;display:grid;place-items:center;background:#000b;z-index:5;padding:20px}
.result .panel{width:min(360px,100%);text-align:center;justify-items:center}
.result h2{font-size:34px}
.win h2{color:var(--amber)} .lose h2{color:var(--bad)}
.lvup{display:grid;justify-items:center;gap:10px;text-align:center;padding-block:10px}
.lvup .big{font-family:var(--fd);font-weight:800;font-size:64px;line-height:1;color:var(--amber);text-shadow:0 4px 0 #5a2410;animation:pop .5s}
@keyframes pop{from{transform:scale(.3)}60%{transform:scale(1.2)}}

/* wheel */
.wheelbox{position:relative;width:min(300px,80vw);aspect-ratio:1/1;max-width:100%;margin:0 auto}
.wheelbox svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.12,1)}
.wheelbox .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--amber);filter:drop-shadow(0 2px 2px #000);z-index:2}

/* pass */
.ptrack{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:stretch}
.ptrack .tn{display:grid;place-items:center;font-family:var(--fd);font-weight:800;border-radius:10px;background:#10161a;border:1px solid #27323b}
.ptrack .tn.ok{border-color:var(--amber);color:var(--amber)}
.prw{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#10161a;border:1px solid #27323b;border-radius:10px;padding:6px 8px;min-width:0}

.prw.locked{opacity:.5}
.prw .cc{font-size:12px}

.pack{position:relative;display:grid;justify-items:center;gap:4px;background:linear-gradient(180deg,#23303a,#151b20);border:1px solid #3a4a56;border-radius:14px;padding:12px 6px;text-align:center}
.pack .pi{font-size:34px;line-height:1.1}
.pack b{font-family:var(--fd);font-size:18px;color:var(--amber)}
.pack .x2{position:absolute;top:-8px;inset-inline-start:-6px;background:var(--bad);color:#fff;font-family:var(--fd);font-weight:800;font-size:11px;border-radius:8px;padding:1px 7px;transform:rotate(-8deg)}
.pack .btn{width:100%}
.hero-offer{background:radial-gradient(ellipse at 50% 0%,#5a3a14,#1a1f22 70%);border:1px solid #8a6a2a;border-radius:16px;padding:14px;display:grid;gap:10px;text-align:center}

/* admin */
.adm-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #26313a;font-size:13px;text-align:start}
.adm-row b{font-family:var(--fd)}
.kpi{background:#10161a;border:1px solid #27323b;border-radius:12px;padding:10px;display:grid;gap:2px}
.kpi small{color:var(--muted);font-size:11px;font-weight:700}
.kpi b{font-family:var(--fd);font-size:22px;color:var(--amber)}

/* toast */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;z-index:80;display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:#0e1215f2;border:1px solid var(--line);border-inline-start:3px solid var(--amber);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 20px #000a;animation:tin .25s;max-width:100%}
.toast.bad{border-inline-start-color:var(--bad)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* battle */
#battle{position:fixed;inset:0;z-index:50;background:#0b0e10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.b-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:#12171a;border-bottom:1px solid var(--line)}
.b-top b{font-family:var(--fd);font-size:15px;display:block}
.b-top small{color:var(--amber);font-family:var(--fd);font-weight:700}
.b-ctl{display:flex;gap:6px}
.b-ctl button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px;font-family:var(--fd);min-height:36px}
.b-ctl button.on{background:var(--rust);border-color:#e58a4a;color:#fff}
.b-stage{flex:1;position:relative;overflow:hidden}
.b-stage canvas{position:absolute;inset:0;width:100%;height:100%}
#b-banner{position:absolute;top:30%;left:0;right:0;text-align:center;font-family:var(--fd);font-weight:800;font-size:30px;color:var(--amber);text-shadow:0 3px 0 #000,0 0 20px #000;pointer-events:none;opacity:0}
#b-banner.go{animation:ban 1.6s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.b-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:8px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:#12171a;border-top:1px solid var(--line)}
.bc{display:grid;justify-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 3px;position:relative}
.bc .av{width:38px;height:38px;font-size:17px}
.bc .bn{font-size:11px;font-weight:800}
.bc .bar{width:100%;height:5px;background:#0a0d0f;border-radius:3px;overflow:hidden}
.bc .bar i{display:block;height:100%;width:100%}
.bc .hp i{background:var(--good)}
.bc .en i{background:var(--sky)}
.bc.ready{border-color:var(--amber);box-shadow:0 0 12px #f1b23c88;animation:rdy .8s infinite alternate}
@keyframes rdy{to{box-shadow:0 0 2px #f1b23c44}}
.bc.ready::after{content:attr(data-tap);position:absolute;top:-9px;background:var(--amber);color:#2a1a04;font-size:10px;font-weight:800;border-radius:5px;padding:0 5px}
.bc.dead{opacity:.35;filter:grayscale(1)}

/* blocking screens */
.block{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px}
.block .panel{max-width:360px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= in-app purchases (StoreKit via @capgo/native-purchases) ================= */
const STORE = { ok: false, prices: {}, busy: false };
const pid = p => CFG.productPrefix + p.id;
async function iapInit() {
  const NP = plugin('NativePurchases');
  if (!NP) return;
  try {
    const sup = await NP.isBillingSupported(); if (!sup || !sup.isBillingSupported) return;
    const { products } = await NP.getProducts({ productIdentifiers: IAP.map(pid) });
    (products || []).forEach(pr => { const p = IAP.find(x => pid(x) === pr.identifier); if (p) STORE.prices[p.id] = { str: pr.priceString, price: pr.price, cur: pr.currencyCode }; });
    STORE.ok = true;
    NP.addListener('transactionUpdated', tx => { const p = IAP.find(x => pid(x) === tx.productIdentifier); if (p) deliver(p, tx); });
    if (tab === 'base' || modalFn) refresh();
  } catch (e) { console.warn('iap', e && e.message); }
}
const priceStr = p => (STORE.prices[p.id] && STORE.prices[p.id].str) || (NATIVE ? '…' : '$' + p.usd.toFixed(2)); // in the app, prices always come from the App Store
const canBuy = () => STORE.ok || CFG.devPurchases;
function packGems(p) { const over = NET.cfg.gem_packs && Number(NET.cfg.gem_packs[p.id]); return over > 0 ? over : (p.gems || 0); }
async function buy(id) {
  const p = IAPB[id]; if (!p || STORE.busy) return;
  if (p.kind === 'starter' && S.starter.bought) { toast(t('already_bought'), 1); return; }
  if (p.kind === 'pass' && hasPrem()) { toast(t('already_bought'), 1); return; }
  if (!canBuy()) { toast(t('iap_app_only'), 1); return; }
  if (STORE.ok && !STORE.prices[p.id]) { toast(t('iap_failed'), 1); return; }
  STORE.busy = true; refresh();
  try {
    let tx;
    if (STORE.ok) {
      const NP = plugin('NativePurchases');
      tx = await NP.purchaseProduct({ productIdentifier: pid(p), quantity: 1 });
    } else tx = { transactionId: 'dev-' + now() + '-' + Math.random().toString(36).slice(2, 8), productIdentifier: pid(p) };
    deliver(p, tx);
  } catch (e) {
    const m = (e && (e.message || e.code)) || ''; if (!/cancel/i.test(m)) toast(t('iap_failed') + (m ? ' · ' + m : ''), 1);
  } finally { STORE.busy = false; refresh(); }
}
function deliver(p, tx) {
  const id = String(tx.transactionId || tx.id || '');
  if (id && S.txDone.includes(id)) return;
  if (id) { S.txDone.push(id); if (S.txDone.length > 300) S.txDone.shift(); }
  let r = {};
  if (p.kind === 'gems') { let g = packGems(p); if (!S.firstBuy[p.id]) { g *= 2; S.firstBuy[p.id] = 1; } r.gems = g; }
  else if (p.kind === 'starter') { r = { ...p.r }; S.starter.bought = true; }
  else if (p.kind === 'monthly') { r.gems = p.gems; S.card.until = Math.max(now(), S.card.until) + p.days * 864e5; S.card.last = ''; }
  else if (p.kind === 'pass') { S.pass.prem = season(); }
  give(r);
  S.vip.pts += p.vip; S.stats.spent = (S.stats.spent || 0) + p.usd;
  save(); SND.rare(); buzz('ok');
  const pr = STORE.prices[p.id] || {};
  logPurchase(p, tx, { price: pr.price || p.usd, currency: pr.cur || 'USD', gems: r.gems || 0 });
  queuePopup(() => mGift(r, t('thanks_buy'), p.kind === 'pass' ? t('pass_unlocked') : ''));
  refresh();
}
async function restorePurchases() {
  const NP = plugin('NativePurchases'); if (!NP) { toast(t('iap_app_only'), 1); return; }
  try { await NP.restorePurchases(); toast(t('restored')); } catch (e) { toast(t('iap_failed'), 1); }
}

function squadRem(id) { const i = S.squad.indexOf(id); if (i < 0) return; if (S.squad.filter(Boolean).length <= 1) { toast(t('need_one_hero'), 1); return; } S.squad[i] = null; save(); refresh(); }
function autoSquad() {

  const bag = prem ? S.pass.p : S.pass.f; if (bag[tier]) return;
  bag[tier] = 1; const r = passReward(tier, prem); give(r); SND.coin(); toast(t('reward_claimed')); save(); refresh();
}
function passClaimAll() { ensurePass(); let n = 0; for (let i = 1; i <= passTier(); i++) { if (!S.pass.f[i]) { S.pass.f[i] = 1; give(passReward(i, false)); n++; } if (hasPrem() && !S.pass.p[i]) { S.pass.p[i] = 1; give(passReward(i, true)); n++; } } if (n) { SND.rare(); toast(t('claimed_n', n)); save(); refresh(); } }

const WHEEL_PRICE = 100;
let wheelSpinning = false, wheelAngle = 0, wheelLast = null;
function spinWheel() {
  if (wheelSpinning) return; wheelReset();
  const free = wheelFree(), item = !free && S.inv.spin > 0;
  if (!free && !item) { if (S.wheel.paid >= 10) { toast(t('wheel_limit'), 1); return; } if (S.res.gems < WHEEL_PRICE) { toast(t('no_gems'), 1); return; } S.res.gems -= WHEEL_PRICE; S.wheel.paid++; }
  else if (free) S.wheel.free++; else S.inv.spin--;
  const seg = weighted(WHEEL), idx = WHEEL.indexOf(seg), n = WHEEL.length, segA = 360 / n;
  const target = 360 - (idx * segA + segA / 2) + (Math.random() - .5) * segA * .6;
  wheelAngle = wheelAngle - (wheelAngle % 360) + 360 * 6 + target;
  wheelSpinning = true; wheelLast = null; save(); renderModal();
  const svg = $('#wheelsvg'); if (svg) { void svg.getBoundingClientRect(); svg.style.transform = `rotate(${wheelAngle}deg)`; }
  let ticks = 0; const tk = setInterval(() => { SND.tick(); if (++ticks > 22) clearInterval(tk); }, 160);
  setTimeout(() => { wheelSpinning = false; give(seg.r); wheelLast = seg.r; S.stats.spins = (S.stats.spins || 0) + 1; track('spin'); passXP(5); SND.rare(); buzz('ok'); save(); renderModal(); renderTop(); }, 4100);
}
function achState(a) { const claimed = S.ach[a.k] || 0, v = a.v(); return { claimed, v, next: a.tiers[claimed], done: claimed >= a.tiers.length, ready: claimed < a.tiers.length && v >= a.tiers[claimed] }; }

function evProgress(e) { if (e.type === 'kills') { const p = S.evp[e.id] || (S.evp[e.id] = { start: S.stats.kills }); return S.stats.kills - p.start; } return 0; }
function evClaim(id) {
  const e = activeEvents().find(x => x.id === id); if (!e) return;
  const p = S.evp[id] || (S.evp[id] = {}); if (p.done) return;
  if (e.type === 'kills' && evProgress(e) < (Number(e.params.goal) || 0)) return;
  p.done = 1; const r = sanitizeRewards(e.params.r || e.params.rewards || {}); give(r); SND.rare(); queuePopup(() => mGift(r, L(e.title))); save(); refresh();
}
function wbReset() { if (S.wb.date !== today()) S.wb = { date: today(), tries: 0 }; }
function startWorldBoss() {
  wbReset(); if (S.wb.tries >= 3) { toast(t('no_tries'), 1); return; }
  if (!S.squad.some(Boolean)) { toast(t('need_squad'), 1); return; }
  S.wb.tries++; closeModal(); save();
  const sc = Math.max(1, S.stage);
  startBattle({ title: t('ev_boss'), waves: [['wb']], sc, boss: true, limit: 60, onEnd: (win, Bt) => {
    const d = Math.round(Bt.dealt); S.stats.bossDmg += d; passXP(10);
    const k = Math.max(1, d / 1000);
    const r = mulR({ gems: Math.min(400, Math.round(10 + Math.sqrt(k) * 8)), exp: Math.round(200 + k * 40), food: Math.round(500 + k * 120) }, evMult('reward'));

/* ================= siege ================= */
function resolveSiege() {
  const Lb = Math.max(1, lvOf('barracks'));
  const def = wallDef(lvOf('wall')) + S.troops * 10 * (1 + .08 * (Lb - 1)) + squadPower() * .5;
  const horde = Math.round(500 * Math.pow(1.42, hqLv() - 1) * (.8 + Math.random() * .45));
  const win = def >= horde; const rep = { win, def: Math.round(def), horde };
  if (win) { rep.r = mulR({ food: Math.round(horde * .8), wood: Math.round(horde * .8), exp: Math.round(horde * .3), gems: 25 }, evMult('reward')); give(rep.r); S.stats.sieges++; addXP(25); passXP(15); }
  else {
    const pr = protect(lvOf('warehouse')); rep.lost = {};
    ['food', 'wood', 'iron', 'fuel'].forEach(k => { const l = Math.floor(Math.max(0, S.res[k] - pr) * .15); if (l) { S.res[k] -= l; rep.lost[k] = l; } });
    const w = Math.floor(S.troops * .15); S.troops -= w; const room = hospCap(lvOf('hospital')) - S.wounded; const kept = Math.max(0, Math.min(w, room)); S.wounded += kept; rep.w = kept; rep.dead = w - kept;
  }
  S.siegeAt = now() + (16 + Math.random() * 12) * 60e3; save(); SND.alarm(); buzz(win ? 'ok' : 'bad');
  openModal(() => mSiege(rep));
}

async function scheduleNotifs() {
  const LN = plugin('LocalNotifications'); if (!LN) return;
  try {
    const pend = await LN.getPending(); if (pend && pend.notifications && pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
    const list = []; const t0 = now(); let id = 1;
    const add = (at, title, body) => { if (at > t0 + 30000) list.push({ id: id++, title, body, schedule: { at: new Date(at) } }); };
    S.builds.forEach(b => add(b.end, t('n_build_t'), t('n_build_b', L(BT[PLOT[b.k].t].n), b.to)));
    if (S.rq) add(S.rq.end, t('n_research_t'), t('n_research_b', L(TECH[S.rq.k].n)));

    const tom = new Date(); tom.setDate(tom.getDate() + 1); tom.setHours(19, 30, 0, 0); add(tom.getTime(), t('n_daily_t'), t('n_daily_b'));

  } catch (e) { }
}

const TS = 64, N = 41, C = 20, ZMIN = .45, ZMAX = 2.4;

function makeNode(k, R) {
  const p = freeSpot(R); if (!p) return null; const d = Math.hypot(p.x - C, p.y - C);
  const n = { id: Math.floor(R() * 1e9).toString(36) + S.world.nodes.length, x: p.x, y: p.y, k };
  if (k === 'z') n.L = clamp(Math.round(d * .9 + R() * 2.5), 1, 50);
  if (k === 'r') { n.L = clamp(Math.ceil(d / 3.6 + R() * 1.2), 1, 8); n.rt = ['food', 'wood', 'iron', 'fuel'][Math.floor(R() * (n.L >= 2 ? 4 : 3))]; n.amt = 1500 * n.L; }
  if (k === 'p') { n.bot = Math.floor(R() * BOTS.length); n.pw = Math.round((2000 + d * 1200) * (.6 + R() * .8)); n.tag = ALLIES[Math.floor(R() * 3)].tag; }
  S.world.nodes.push(n); return n;
}
function near(R, lo, hi) { for (let i = 0; i < 300; i++) { const a = R() * Math.PI * 2, d = lo + R() * (hi - lo), x = Math.round(C + Math.cos(a) * d), y = Math.round(C + Math.sin(a) * d); if (x < 0 || y < 0 || x >= N || y >= N || (Math.abs(x - C) <= 1 && Math.abs(y - C) <= 1) || S.world.nodes.some(n => n.x === x && n.y === y)) continue; return { x, y }; } return null; }

let lastTick = now();

function tick() {
  const tm = now(), dt = clamp(tm - lastTick, 0, 24 * 3600e3); lastTick = tm;

  if (allyHelpTick(Math.min(dt, 5000))) ch = true;
  if (marchTick()) ch = true;
  if (hqLv() >= 2 && tm >= S.siegeAt && !B && !modalFn) { resolveSiege(); ch = true; }
  if (S.alliance && tm - S.chatAt > 45000 + Math.random() * 40000) { S.chatAt = tm; S.chat.push({ u: pick(BOTS), m: pick(CHATL), t: tm }); if (S.chat.length > 40) S.chat.shift(); if (tab === 'alliance') ch = true; }

  $$('[data-bar]').forEach(e => { const st = +e.dataset.st, en = +e.dataset.en; e.style.width = clamp((tm - st) / (en - st) * 100, 0, 100) + '%'; });
  $$('[data-gem]').forEach(e => { const g = gemCost(+e.dataset.gem - tm); e.textContent = g ? `💎 ${g}` : t('free_finish'); });
  $$('[data-acc]').forEach(e => { const k = e.dataset.acc, b = S.b[k], cap = storeCap(PLOT[k].t, b.lv); const show = b.acc >= Math.max(5, cap * .04); e.hidden = !show; if (show) e.lastChild.textContent = fmt(b.acc); });
  $$('[data-stam]').forEach(e => e.textContent = Math.floor(S.stam));
}

/* ================= actions ================= */
const ACT = {
  tab: x => { closeModal(); tab = x; render(); },
  close: () => closeModal(),
  bld: x => openModal(() => mBuilding(x)),
  locked: x => toast(t('unlock_hq', x)),
  collect: (x, el) => { if (collect(x, el.closest('.tile'))) track('collect'); tickUI(); },
  collect1: x => { if (collect(x, document.querySelector(`[data-tile="${x}"]`))) track('collect'); refresh(); },
  collectAll: () => collectAll(),
  up: x => upgrade(x, false), inst: x => upgrade(x, true), fill: x => fillRes(x),
  usesp: x => { const [r, i] = x.split('|'); useSpeed(r, i); }, gemfin: x => gemFinish(x), help: x => askHelp(x),
  helpAll: () => { let n = 0; for (const q of [...S.builds, S.rq, S.tq]) if (q && !q.hr) { q.hr = true; n++; } toast(n ? t('help_asked_n', n) : t('no_timers')); refresh(); },
  train: () => doTrain(), heal: () => doHeal(), research: x => doResearch(x),
  hero: x => openModal(() => mHero(x)), hlv: x => { const [id, n] = x.split('|'); heroLevelUp(id, +n); }, hstar: x => heroStar(x),
  sqadd: x => squadAdd(x), sqrem: x => squadRem(x), autoSquad: () => autoSquad(),
  slot: x => openModal(() => mSlot(+x)),
  slotset: x => { const [i, id] = x.split('|'); const j = S.squad.indexOf(id); if (j >= 0) S.squad[j] = S.squad[+i]; S.squad[+i] = id; save(); closeModal(); refresh(); },
  slotclr: x => { if (S.squad.filter(Boolean).length <= 1) { toast(t('need_one_hero'), 1); return; } S.squad[+x] = null; save(); closeModal(); refresh(); },
  openRecruit: () => { lastPull = []; openModal(mRecruit); }, recruit: x => recruit(+x),
  fight: () => startCampaign(),
  attackNode: x => attackNode(x), gather: x => startGather(x),
  recenter: () => { const h = homeCam(); flyTo(h.x, h.y, 1); },
  zoomIn: () => zoomAt(wW / 2, wH / 2, cam.z * 1.4, true), zoomOut: () => zoomAt(wW / 2, wH / 2, cam.z / 1.4, true), findZ: () => findTarget(),
  qclaim: () => claimQuest(), qgo: () => goQuest(), quests: () => openModal(mQuests),
  events: () => openModal(mEvents), worldBoss: () => startWorldBoss(), evClaim: x => evClaim(x),
  login: () => { if (S.login.last === today()) return; const r = LOGIN[S.login.day % 7]; give(r); S.login.day++; S.login.last = today(); passXP(20); SND.rare(); toast(t('login_claimed')); save(); refresh(); },
  dclaim: x => { ensureDaily(); const d = DAILY.find(d => d.k === x); if (!d || S.daily.c[x] || (S.daily.p[x] || 0) < d.g) return; S.daily.c[x] = 1; S.res.gems += 10; passXP(20); addXP(10); SND.coin(); toast(t('task_claimed')); save(); refresh(); },
  chest: x => { const c = CHESTS[+x]; if (dailyPoints() < c.p || S.daily.c['chest' + x]) return; S.daily.c['chest' + x] = 1; give(c.r); passXP(30); SND.rare(); toast(t('chest_opened')); save(); refresh(); },
  shop: () => { shopTab = 'gems'; openModal(mShop); }, shopTab: x => { shopTab = x; renderModal(true); },
  buy: x => buy(x), restore: () => restorePurchases(), starter: () => openModal(mStarter),
  gbuy: x => { const s = GSHOP.find(s => s.k === x); if (!s) return; if (x === 'free') { if (S.freeBox === today()) return; S.freeBox = today(); } else { const p = gprice(s); if (S.res.gems < p) { toast(t('no_gems'), 1); return; } S.res.gems -= p; } give(s.r); SND.coin(); toast(t('bought', t('g_' + s.k))); save(); refresh(); },
  cardClaim: () => cardClaim(),
  bag: () => openModal(mBag),
  useStam: () => { if (!S.inv.stam) return; S.inv.stam--; S.stam = Math.min(150, S.stam + 50); toast(t('stam_added')); save(); refresh(); },
  wheel: () => { wheelLast = null; openModal(mWheel); }, spin: () => spinWheel(),
  pass: () => openModal(mPass), passClaim: x => { const [i, p] = x.split('|'); passClaim(+i, p === '1'); }, passAll: () => passClaimAll(),
  achs: () => openModal(mAchs), achClaim: x => achClaim(x),
  vip: () => openModal(mVip), vipChest: () => vipChest(),
  rank: () => { rankData = null; openModal(mRank); },
  mail: () => openModal(mMail),
  settings: () => openModal(mSettings), tut: () => openModal(mTut),
  lang: x => { S.lang = x; setLang(x); save(); refresh(); syncPlayer().catch(() => { }); },
  langPick: x => { S.lang = x; setLang(x); save(); closeModal(); render(); if (!S.tut) { S.tut = true; openModal(mTut); } },
  tsnd: () => { S.snd = !S.snd; save(); renderModal(); if (S.snd) SND.coin(); },
  tvib: () => { S.vib = !S.vib; save(); renderModal(); buzz('medium'); },
  copyId: () => { const v = '#' + (NET.me && NET.me.short_id); try { navigator.clipboard.writeText(v).then(() => toast(t('copied')), () => toast(v)); } catch (e) { toast(v); } },
  verTap: () => { const tm = now(); if (tm - adminTapAt > 1500) adminTaps = 0; adminTapAt = tm; adminTaps++; if (adminTaps >= 7) { adminTaps = 0; openAdmin(); } else if (adminTaps >= 4) toast(t('taps_left', 7 - adminTaps)); },
  reset: () => {
    if (resetArm > now()) { storeDel(KEY); const l = S.lang; S = newState(); S.lang = l; S.tut = true; resetArm = 0; cam = null; closeModal(); tab = 'base'; genWorld(); save(true); refresh(); toast(t('new_game_started')); }
    else { resetArm = now() + 3000; renderModal(); setTimeout(() => { if (modalFn === mSettings) renderModal(); }, 3100); }
  },
  offCollect: () => { closeModal(); collectAll(); },
  delAcc: () => {
    if (delArm > now()) { delArm = 0; deleteAccount().catch(() => { }).finally(() => { storeDel(KEY); toast(t('account_deleted')); setTimeout(() => location.reload(), 900); }); }
    else { delArm = now() + 3000; renderModal(); setTimeout(() => { if (modalFn === mSettings) renderModal(); }, 3100); }
  },
  join: x => { const i = +x, a = ALLIES[i]; const m = BOTS.slice().sort(() => Math.random() - .5).slice(0, 8 + a.lv % 4).map((n, j) => ({ n, p: Math.round((60000 - j * 5000) * (.6 + Math.random() * .6)) })).sort((p, q) => q.p - p.p); S.alliance = { i, m, gift: '' }; S.chat = [{ u: m[0].n, m: { ar: `حيّاك الله في ${a.n.ar}! 👋`, en: `Welcome to ${a.n.en}! 👋` }, t: now() }]; S.chatAt = now(); toast(t('joined_ally', L(a.n))); SND.up(); save(); refresh(); },
  leave: (x, el) => { if (el.dataset.arm) { S.alliance = null; S.chat = []; toast(t('left_ally')); save(); refresh(); } else { el.dataset.arm = '1'; el.textContent = t('tap_confirm'); el.classList.add('danger'); } },
  gift: () => { if (!S.alliance || S.alliance.gift === today()) return; S.alliance.gift = today(); give({ gems: 60, food: 3000, wood: 3000, sp5: 2 }); SND.rare(); toast(t('ally_gift_got')); save(); refresh(); },
  ...ADMIN_ACT,
};
document.addEventListener('click', e => {
  const m = $('#modal'); if (e.target === m) { if (!modalFull) closeModal(); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (el.tagName === 'SELECT') return;
  const f = ACT[el.dataset.a]; if (f) { e.stopPropagation(); ac(); if (el.dataset.a !== 'collect') SND.click(); f(el.dataset.x, el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('select[data-a]'); if (el && ACT[el.dataset.a]) ACT[el.dataset.a](el.value, el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalFn && !modalFull) closeModal(); if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-a]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => {
  if (e.target.id === 'trn') { trainN = +e.target.value; $('#trnv').textContent = trainN; const per = trainCostPer(); $('#trnc').innerHTML = `${costHTML({ food: per.food * trainN, iron: per.iron * trainN })} <span class="cc">⏱ ${fmtT(trainMs(trainN) / 1000)}</span>`; }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const id = e.target.id;
  if (id === 'chatf') {
    const i = $('#chatin'); const v = i.value.trim(); if (!v) return; S.chat.push({ me: true, m: v, t: now() }); if (S.chat.length > 40) S.chat.shift(); i.value = '';
    setTimeout(() => { if (!S.alliance) return; S.chat.push({ u: pick(S.alliance.m).n, m: pick(CHATR), t: now() }); if (tab === 'alliance') render(); }, 1500 + Math.random() * 2500); save(); render();
  }
  if (id === 'namef') { const v = $('#namein').value.trim().slice(0, 16); if (v) { S.name = v; save(); toast(t('name_saved')); refresh(); syncPlayer().catch(() => { }); } }
  if (id === 'admLoginF') { const em = val('admEmail'), pw = $('#admPass').value; admRun(async () => { await adminLogin(em, pw); ADM.tab = 'dash'; await admLoad('dash', true); }, t('welcome_admin')); }
  if (id === 'admSearchF') { ADM.q = val('admQ'); ADM.sel = null; admLoad('players', true); }
});
window.addEventListener('resize', () => { if (tab === 'world') sizeWorld(); if (B) { bResize(); bBg(); } });
$('#b-cards').addEventListener('click', e => { const el = e.target.closest('.bc'); if (!el || !B) return; const h = B.heroes.find(x => x.slot === +el.dataset.slot); if (h) cast(h); });
$('#b-spd').onclick = () => { S.spd = S.spd === 1 ? 2 : 1; $('#b-spd').textContent = '×' + S.spd; $('#b-spd').classList.toggle('on', S.spd > 1); };
$('#b-auto').onclick = () => { S.auto = !S.auto; $('#b-auto').classList.toggle('on', S.auto); };
$('#b-quit').onclick = () => { if (!B || B.done) return; if (B.quitArm > now()) bEnd(!!B.cfg.boss, t('retreated')); else { B.quitArm = now() + 2500; $('#b-quit').textContent = t('sure'); setTimeout(() => { if (B && !B.done) $('#b-quit').textContent = t('retreat'); }, 2500); } };

/* ================= save ================= */
const KEY = 'fajr-naajin-save-v1';
let lastLocal = 0, cloud = null, cloudBusy = false, lastCloud = 0;
function save(force) {
  S.savedAt = now(); lastLocal = S.savedAt;
  storeSet(KEY, JSON.stringify(S));
  if (force) { pushCloud(); syncPlayer().catch(() => { }); }
}
function autosave() { const tm = now(); if (tm - lastLocal > 5000) save(); if (cloud && tm - lastCloud > 45000) pushCloud(); }
async function pushCloud() { if (!cloud || cloudBusy) return; cloudBusy = true; lastCloud = now(); try { await cloud.set({ savedAt: S.savedAt, data: JSON.stringify(S) }); } catch (e) { } cloudBusy = false; }
function loadLocal() { try { const raw = storeGet(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) { } return null; }
function catchUp(st) {
  const off = clamp(now() - st.savedAt, 0, 24 * 3600e3); S = st;
  const before = {}; PLOTS.forEach(p => { if (BT[p.t].prod) before[p.k] = S.b[p.k].acc; });
  produce(off);
  const gained = {}; PLOTS.forEach(p => { const T = BT[p.t]; if (!T.prod) return; const g = S.b[p.k].acc - before[p.k]; if (g > 0) gained[T.prod] = (gained[T.prod] || 0) + g; });
  if (S.siegeAt < now()) S.siegeAt = now() + 5 * 60e3;
  return { off, gained };
}
/* optional: cloud save when the game is opened inside claude.ai */
async function connectClaudeCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!d || !u) return; const id = await u.id(); if (!id) return;
    const ref = d.doc(`data/users/${id}/saves/main`); const snap = await ref.get(); cloud = ref;
    if (snap.exists) { const r = snap.data(); if (r && r.data && (r.savedAt || 0) > (S.savedAt || 0) + 3000) { try { const st = migrate(JSON.parse(r.data)); catchUp(st); setLang(S.lang || LANG); lastTick = now(); save(); refresh(); toast(t('cloud_loaded')); } catch (e) { } } }
    else pushCloud();
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); pushCloud(); syncPlayer().catch(() => { }); scheduleNotifs(); } else { const LN = plugin('LocalNotifications'); if (LN) LN.getPending().then(p => p && p.notifications && p.notifications.length && LN.cancel({ notifications: p.notifications.map(n => ({ id: n.id })) })).catch(() => { }); } });
try { const P = plugin('App'); if (P) P.addListener('pause', () => { save(); syncPlayer().catch(() => { }); scheduleNotifs(); }); const SB = plugin('StatusBar'); if (SB) SB.setStyle({ style: 'DARK' }).catch(() => { }); } catch (e) { }

/* ================= boot ================= */
function start(data) {
  let info = null;
  if (data && data.S) { S = migrate(data.S); if (typeof data.tab === 'string') tab = data.tab; }
  else { const st = loadLocal(); if (st) info = catchUp(st); else S = newState(); }
  setLang(S.lang || guessLang());
  lastTick = now(); ensureDaily(); ensurePass();
  if (!S.world.nodes) genWorld();
  render();
  if (!S.lang) openModal(mLang);
  else if (!S.tut) { S.tut = true; openModal(mTut); }
  else if (info && info.off > 300000 && Object.keys(info.gained).length) openModal(() => mOffline(info.off / 1000, info.gained));
  else if (info && info.off > 60000) toast(t('produced_away', fmtT(info.off / 1000)));
  setInterval(tick, 250);
  setInterval(() => { netTick(); }, 15000);
  connectClaudeCloud(); netInit(); iapInit();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ S, tab })); } catch (e) { }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();
</script>
